plugins { id 'com.android.application' }
// Android 2.4.9 review candidate: preserve the package identity and monotonic versionCode.
// Paired Android/Windows rebuild after publisher compatibility fixes; do not publish until both builds pass.
android {
 namespace 'com.mohammedmustafa.smartcompany'
 buildFeatures { buildConfig true }
 compileSdk 36
 defaultConfig {
  applicationId 'com.mohammedmustafa.smartcompany'
  minSdk 23
  targetSdk 36
  versionCode 2004009
  versionName '2.4.9'
 }
 testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 implementation 'androidx.core:core:1.12.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}

plugins { id 'com.android.application' }
android {
 namespace 'com.mohammedmustafa.smartcompany'
 buildFeatures { buildConfig true }
 compileSdk 36
 flavorDimensions += "edition"
 defaultConfig {
  applicationId 'com.mohammedmustafa.smartcompany'
  minSdk 23
  targetSdk 36
  versionCode 39
  versionName '2.3.8'
 }
 productFlavors {
  basic {
   dimension "edition"
   applicationIdSuffix ".basic"
   buildConfigField "String", "EDITION", '"basic"'
  }
  pro {
   dimension "edition"
   applicationIdSuffix ".pro"
   buildConfigField "String", "EDITION", '"pro"'
  }
  business {
   dimension "edition"
   applicationIdSuffix ".business"
   buildConfigField "String", "EDITION", '"business"'
  }
 }
 testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 implementation 'androidx.core:core:1.12.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}

plugins { id 'com.android.application' }
android {
 namespace 'com.mohammedmustafa.smartcompany'
 buildFeatures { buildConfig true }
 compileSdk 36
 defaultConfig {
  applicationId 'com.mohammedmustafa.smartcompany'
  minSdk 23
  targetSdk 36
  versionCode 41
  versionName '2.4.0'
 }
 // Shared core/schema for all editions. Enterprise keeps the existing package ID
 // so current installs can update; other editions get distinct IDs for side-by-side QA.
 flavorDimensions += 'edition'
 productFlavors {
  basic {
   dimension 'edition'
   applicationIdSuffix '.basic'
   buildConfigField 'String', 'EDITION_NAME', '"Basic"'
   buildConfigField 'int', 'EDITION_LEVEL', '1'
  }
  pro {
   dimension 'edition'
   applicationIdSuffix '.pro'
   buildConfigField 'String', 'EDITION_NAME', '"Pro"'
   buildConfigField 'int', 'EDITION_LEVEL', '2'
  }
  business {
   dimension 'edition'
   applicationIdSuffix '.business'
   buildConfigField 'String', 'EDITION_NAME', '"Business"'
   buildConfigField 'int', 'EDITION_LEVEL', '3'
  }
  enterprise {
   buildConfigField 'String', 'EDITION_NAME', '"Enterprise"'
   buildConfigField 'int', 'EDITION_LEVEL', '4'
  }
 }
 testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 implementation 'androidx.core:core:1.12.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}

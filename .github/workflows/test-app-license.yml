name: App license API tests

on:
  push:
    branches: ["main", "release-hardening-2.3.6"]
    paths:
      - "delivery/worker.mjs"
      - "delivery/tests/**"
      - ".github/workflows/test-app-license.yml"
  pull_request:
    paths:
      - "delivery/worker.mjs"
      - "delivery/tests/**"
      - ".github/workflows/test-app-license.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-app-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run app license regression tests
        run: node --test delivery/tests/app-license.test.mjs

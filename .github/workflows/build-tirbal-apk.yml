name: Build Hisab Al-Tirbal APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hisab-al-tirbal-android-v1
    paths:
      - 'tirbal-app/**'
      - '.github/workflows/build-tirbal-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tirbal-app/**'
      - '.github/workflows/build-tirbal-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon -p tirbal-app :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-al-tirbal-debug-apk
          path: tirbal-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

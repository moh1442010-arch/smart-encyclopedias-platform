name: Final commercial consistency repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'إغلاق نهائي — توحيد الأسعار والدفع'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair public commercial wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'الذكاء%20%D8%A7%D9%84%D8%B0%D9%83%D8%A7%D8%A1%20%D8%A7%D9%84%D8%A7%D8%B5%D8%B7%D9%86%D8%A7%D8%B9%D9%8A':'الذكاء%20%D8%A7%D9%84%D8%A7%D8%B5%D8%B7%D9%86%D8%A7%D8%B9%D9%8A',
            'عرض أسبقية الحجز لأول 200 نسخة':'خصم 20% لأول 200 نسخة',
            'عرض أسبقية الحجز بخصم 25% لأول 200 نسخة بسعر 112,500 جنيه. للطلاب خصم ثابت 30% بسعر 105,000 جنيه مع إبراز بطاقة طالب أو بطاقة جامعية.':'خصم 20% لأول 200 نسخة بسعر 120,000 جنيه. للطلاب سعر 120,000 جنيه.',
            'عرض أول 200 نسخة: 112,500 جنيه سوداني':'عرض أول 200 نسخة: 120,000 جنيه سوداني',
            'سعر الطلاب: 105,000 جنيه سوداني':'سعر الطلاب: 120,000 جنيه سوداني',
            '150,000 جنيه سوداني 112500 جنيه سوداني':'150,000 جنيه سوداني 120,000 جنيه سوداني',
            'السعر الأساسي 150,000 جنيه سوداني. يوجد عرض أسبقية الحجز لأول 200 نسخة بسعر 112,500 جنيه، وسعر الطلاب 105,000 جنيه وفق الشروط الموضحة.':'السعر الأساسي 150,000 جنيه سوداني. يوجد خصم 20% لأول 200 نسخة بسعر 120,000 جنيه، وسعر الطلاب 120,000 جنيه.',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('checkout.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'خيارات شراء الموسوعة الشاملة في الذكاء الاصطناعي بالدفع المحلي أو الدولار مع حاسبة العملات العربية.':'شراء الموسوعة الشاملة بالدفع الفعلي بالجنيه السوداني أو الدولار الأمريكي، مع حاسبة استرشادية للعملات الأخرى.',
            '<h2>خيارات الدفع</h2>':'<h2>خيارات الدفع الفعلية</h2>\n<p><strong>الدفع الفعلي متاح فقط بالجنيه السوداني (SDG) أو الدولار الأمريكي (USD).</strong> حاسبة العملات الأخرى أدناه للاستعلام التقريبي فقط وليست وسيلة دفع.</p>',
            '🌍 ما يعادل الدولار بعملتك — سعر الصرف اليوم':'🌍 حاسبة استرشادية — ليست وسيلة دفع',
            '💱 الأسعار التقريبية بعملات عربية':'💱 تحويل تقريبي من الدولار إلى عملات أخرى',
            'السعر محسوب من سعر النسخ بالدولار (حسب الكمية والعرض) وفق سعر صرف إرشادي محدث يوميًا. قد يختلف السعر الفعلي قليلًا حسب البنك أو مزود الدفع. مصدر أسعار الصرف:':'هذه الحاسبة للاستعلام فقط ولا تنشئ التزامًا بالدفع بهذه العملات. الدفع الفعلي متاح بالجنيه السوداني أو الدولار الأمريكي فقط. السعر محسوب من سعر النسخ بالدولار وفق سعر صرف إرشادي محدث يوميًا، وقد يختلف السعر الفعلي قليلًا حسب البنك. مصدر أسعار الصرف:',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired files
        run: |
          git config user.name 'moh1442010-arch'
          git config user.email 'moh1442010@gmail.com'
          git add index.html checkout.html
          git diff --cached --quiet || git commit -m 'إغلاق نهائي — توحيد الأسعار والدفع'
          git push

name: Recover stuck GitHub Pages deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-stuck-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel known stale Pages deployments safely
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const staleDeployments = [
              '5a19624dec6d27c646001633caa7e6f83e910c9b',
              'bae478500b5c9824c13eeb7ceb6b79a5ef6699ce'
            ];
            for (const deployment of staleDeployments) {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                  owner,
                  repo,
                  pages_deployment_id: deployment
                });
                core.info('Cancellation accepted for stale Pages deployment ' + deployment);
              } catch (error) {
                const message = String(error.message || '');
                if ([400, 404, 409].includes(error.status) &&
                    (error.status !== 400 || /finished|already|not in progress/i.test(message))) {
                  core.info('Deployment is already inactive; no cancellation needed: ' + deployment);
                } else {
                  throw error;
                }
              }
            }
            core.info('Stale deployment cleanup finished. GitHub Pages deployment is handled by the Pages workflow.');

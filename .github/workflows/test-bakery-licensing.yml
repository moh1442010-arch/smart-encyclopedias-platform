name: Validate bakery licensing portal
on:
  push:
    paths:
      - "licensing/**"
      - "store/license.html"
      - "store/license-admin.html"
      - ".github/workflows/test-bakery-licensing.yml"
  pull_request:
    paths:
      - "licensing/**"
      - "store/license.html"
      - "store/license-admin.html"
      - ".github/workflows/test-bakery-licensing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check licensing/worker/src/index.js
      - name: Check safe local signing-key validator syntax
        run: node --check tools/validate-bakery-license-key.mjs
      - name: Run Worker configuration regression tests
        run: node --test licensing/worker/tests/*.test.mjs
      - name: Validate SQL schema
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path("licensing/schema.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.executescript(sql)
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"license_orders", "license_audit"}.issubset(tables), tables
          print("D1 schema SQL parsed successfully.")
          PY
      - name: Ensure storefront has no embedded admin or private key
        run: |
          ! grep -E 'ADMIN_API_KEY|LICENSE_PRIVATE_KEY_PKCS8_B64' store/license.html store/license-admin.html
          grep -q 'https://wa.me/249121851285' store/license.html
          ! grep -q 'LICENSE_PRIVATE_KEY_PKCS8_B64\|ADMIN_PASSWORD\|API_BASE' store/license.html
          echo "No private/admin secrets embedded; storefront uses the owner-approved WhatsApp flow without a Cloudflare dependency."

      - name: Check bakery release version and public-key consistency
        run: |
          APP_VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" bakery-app/app/build.gradle)"
          WORKER_VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' licensing/worker/wrangler.toml)"
          test -n "$APP_VERSION" && test "$APP_VERSION" = "$WORKER_VERSION"
          test "$APP_VERSION" = "2.8.0"
          grep -q "versionCode 280000" bakery-app/app/build.gradle
          APP_KEY="$(grep -oE 'private static final String LICENSE_PUBLIC_KEY_B64 = "[^"]+"' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java | cut -d '"' -f2)"
          WORKER_KEY="$(grep -oE 'EXPECTED_APP_PUBLIC_KEY_DER_B64 = "[^"]+"' licensing/worker/src/index.js | cut -d '"' -f2)"
          test -n "$APP_KEY" && test "$APP_KEY" = "$WORKER_KEY"
          echo "Bakery version and app/Worker public keys are consistent."

      - name: Syntax-check storefront and admin browser scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("store/license.html", "/tmp/bakery-store.js"),
              ("store/license-admin.html", "/tmp/bakery-admin.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
              assert scripts, f"No inline script found in {source}"
              Path(target).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/bakery-store.js
          node --check /tmp/bakery-admin.js

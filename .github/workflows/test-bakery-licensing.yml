name: Validate bakery licensing portal
on:
  push:
    paths:
      - "licensing/**"
      - "store/license.html"
      - "store/license-admin.html"
      - ".github/workflows/test-bakery-licensing.yml"
  pull_request:
    paths:
      - "licensing/**"
      - "store/license.html"
      - "store/license-admin.html"
      - ".github/workflows/test-bakery-licensing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check licensing/worker/src/index.js
      - name: Check safe local signing-key validator syntax
        run: node --check tools/validate-bakery-license-key.mjs
      - name: Run Worker configuration regression tests
        run: node --test licensing/worker/tests/*.test.mjs
      - name: Validate SQL schema
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path("licensing/schema.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.executescript(sql)
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"license_orders", "license_audit"}.issubset(tables), tables
          print("D1 schema SQL parsed successfully.")
          PY
      - name: Ensure storefront has no embedded admin or private key
        run: |
          ! grep -E 'ADMIN_API_KEY|LICENSE_PRIVATE_KEY_PKCS8_B64' store/license.html store/license-admin.html
          grep -q 'https://wa.me/249121851285' store/license.html
          ! grep -q 'LICENSE_PRIVATE_KEY_PKCS8_B64\|ADMIN_PASSWORD\|API_BASE' store/license.html
          echo "No private/admin secrets embedded; storefront uses the owner-approved WhatsApp flow without a Cloudflare dependency."

      - name: Check deployed release, main offline issuer, and signing keys
        run: |
          set -euo pipefail
          git fetch origin develop/bakery-2.9-enterprise-completion --depth=1
          RELEASE_GRADLE="$(git show FETCH_HEAD:bakery-app/app/build.gradle)"
          RELEASE_VERSION="$(printf '%s\\n' "$RELEASE_GRADLE" | grep -oE "versionName '[^']+'" | head -1 | cut -d "'" -f2)"
          RELEASE_VERSION_CODE="$(printf '%s\\n' "$RELEASE_GRADLE" | grep -oE 'versionCode [0-9]+' | awk '{print $2}')"
          MAIN_APP_VERSION="$(grep -oE "versionName '[^']+'" bakery-app/app/build.gradle | head -1 | cut -d "'" -f2)"
          ISSUER_VERSION="$(grep -oE 'CURRENT_APP_VERSION = "[^"]+"' tools/bakery-license-issuer.mjs | cut -d '"' -f2)"
          WORKER_VERSION="$(grep -oE 'APP_VERSION = "[^"]+"' licensing/worker/wrangler.toml | cut -d '"' -f2)"
          test "$RELEASE_VERSION" = "2.8.0"
          test "$RELEASE_VERSION_CODE" = "280000"
          test "$RELEASE_VERSION" = "$WORKER_VERSION"
          test "$MAIN_APP_VERSION" = "$ISSUER_VERSION"
          RELEASE_KEY="$(git show FETCH_HEAD:bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java | grep -oE 'private static final String LICENSE_PUBLIC_KEY_B64 = "[^"]+"' | cut -d '"' -f2)"
          WORKER_KEY="$(grep -oE 'EXPECTED_APP_PUBLIC_KEY_DER_B64 = "[^"]+"' licensing/worker/src/index.js | cut -d '"' -f2)"
          ISSUER_KEY="$(grep -oE 'EXPECTED_PUBLIC_KEY_DER_B64 = "[^"]+"' tools/bakery-license-issuer.mjs | cut -d '"' -f2)"
          test -n "$RELEASE_KEY" && test "$RELEASE_KEY" = "$WORKER_KEY"
          test "$ISSUER_KEY" = "$WORKER_KEY"
          echo "Current 2.8.0 release matches Worker; main-branch offline issuer matches its source; all signing public keys match."
      - name: Syntax-check storefront and admin browser scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("store/license.html", "/tmp/bakery-store.js"),
              ("store/license-admin.html", "/tmp/bakery-admin.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
              assert scripts, f"No inline script found in {source}"
              Path(target).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/bakery-store.js
          node --check /tmp/bakery-admin.js

name: Validate bakery licensing portal
on:
  push:
    paths:
      - "licensing/**"
      - "store/license.html"
      - "store/license-admin.html"
      - ".github/workflows/test-bakery-licensing.yml"
      - ".github/workflows/deploy-bakery-licensing.yml"
  pull_request:
    paths:
      - "licensing/**"
      - "store/license.html"
      - "store/license-admin.html"
      - ".github/workflows/test-bakery-licensing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check licensing/worker/src/index.js
      - name: Check safe local signing-key validator syntax
        run: node --check tools/validate-bakery-license-key.mjs
      - name: Run Worker configuration regression tests
        run: node --test licensing/worker/tests/*.test.mjs
      - name: Validate SQL schema
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path("licensing/schema.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.executescript(sql)
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"license_orders", "license_audit"}.issubset(tables), tables
          print("D1 schema SQL parsed successfully.")
          PY
      - name: Ensure storefront has no embedded admin or private key
        run: |
          ! grep -E 'ADMIN_API_KEY|LICENSE_PRIVATE_KEY_PKCS8_B64' store/license.html store/license-admin.html
          grep -q 'https://wa.me/249121851285' store/license.html
          ! grep -q 'LICENSE_PRIVATE_KEY_PKCS8_B64\|ADMIN_PASSWORD\|API_BASE' store/license.html
          echo "No private/admin secrets embedded; storefront uses the owner-approved WhatsApp flow without a Cloudflare dependency."

      - name: Check 2.8.2 candidate, 2.8.1 upgrade compatibility, and signing-key continuity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin review/bakery-2.8.1-device-acceptance:refs/remotes/origin/review/bakery-2.8.1-device-acceptance --depth=1
          

          PREVIOUS_GRADLE="$(git show origin/review/bakery-2.8.1-device-acceptance:bakery-app/app/build.gradle)"
          CANDIDATE_GRADLE="$(cat bakery-app/app/build.gradle)"
          PREVIOUS_VERSION="$(printf '%s\n' "$PREVIOUS_GRADLE" | grep -oE "versionName '[^']+'" | head -1 | cut -d "'" -f2)"
          PREVIOUS_CODE="$(printf '%s\n' "$PREVIOUS_GRADLE" | grep -oE 'versionCode [0-9]+' | awk '{print $2}')"
          CANDIDATE_VERSION="$(printf '%s\n' "$CANDIDATE_GRADLE" | grep -oE "versionName '[^']+'" | head -1 | cut -d "'" -f2)"
          CANDIDATE_CODE="$(printf '%s\n' "$CANDIDATE_GRADLE" | grep -oE 'versionCode [0-9]+' | awk '{print $2}')"
          WORKER_VERSION="$(grep -oE '^APP_VERSION = "[^"]+"' licensing/worker/wrangler.toml | cut -d '"' -f2)"
          WORKER_PREVIOUS="$(grep -oE '^PREVIOUS_APP_VERSION = "[^"]+"' licensing/worker/wrangler.toml | cut -d '"' -f2)"
          printf 'Release versions: previous=%s (%s), candidate=%s (%s), Worker=%s, Worker previous=%s\n' "$PREVIOUS_VERSION" "$PREVIOUS_CODE" "$CANDIDATE_VERSION" "$CANDIDATE_CODE" "$WORKER_VERSION" "$WORKER_PREVIOUS"
          test "$PREVIOUS_VERSION" = "2.8.1" || { echo "::error::Expected previous app version 2.8.0"; exit 1; }
          test "$PREVIOUS_CODE" = "280001" || { echo "::error::Expected previous versionCode 280000"; exit 1; }
          test "$CANDIDATE_VERSION" = "2.8.2" || { echo "::error::Expected candidate app version 2.8.1"; exit 1; }
          test "$CANDIDATE_CODE" = "280002" || { echo "::error::Expected candidate versionCode 280001"; exit 1; }
          test "$WORKER_VERSION" = "$CANDIDATE_VERSION" || { echo "::error::Worker APP_VERSION does not match candidate"; exit 1; }
          test "$WORKER_PREVIOUS" = "$PREVIOUS_VERSION" || { echo "::error::Worker PREVIOUS_APP_VERSION does not match previous app"; exit 1; }

          extract_first_public_key() { grep -oE '"[A-Za-z0-9+/=]{100,}"' "$1" | head -1 | tr -d '"'; }
          PREVIOUS_GATE="$(git show origin/review/bakery-2.8.1-device-acceptance:bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/LicenseAccessGate.java 2>/dev/null || true)"
          if [ -z "$PREVIOUS_GATE" ]; then PREVIOUS_GATE="$(git show origin/review/bakery-2.8.1-device-acceptance:bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java)"; fi
          PREVIOUS_KEY="$(printf '%s' "$PREVIOUS_GATE" | grep -oE '"[A-Za-z0-9+/=]{100,}"' | head -1 | tr -d '"')"
          CANDIDATE_GATE="$(cat bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/LicenseAccessGate.java)"
          if [ -z "$CANDIDATE_GATE" ]; then CANDIDATE_GATE="$(git show origin/feature/almizan-global-platform-foundation:bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java)"; fi
          CANDIDATE_KEY="$(printf '%s' "$CANDIDATE_GATE" | grep -oE '"[A-Za-z0-9+/=]{100,}"' | head -1 | tr -d '"')"
          WORKER_KEY="$(grep -oE 'EXPECTED_APP_PUBLIC_KEY_DER_B64 = "[^"]+"' licensing/worker/src/index.js | cut -d '"' -f2)"
          MAIN_APP_KEY="$(extract_first_public_key bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/LicenseAccessGate.java)"
          MAIN_ISSUER_KEY="$(grep -oE 'EXPECTED_PUBLIC_KEY_DER_B64 = "[^"]+"' tools/bakery-license-issuer.mjs | cut -d '"' -f2)"
          test -n "$PREVIOUS_KEY" && grep -Fq "$PREVIOUS_KEY" bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/LicenseAccessGate.java
          test "$CANDIDATE_KEY" = "$WORKER_KEY"
          test "$MAIN_APP_KEY" = "$WORKER_KEY"
          test "$MAIN_ISSUER_KEY" = "$WORKER_KEY"
          echo "PASS: Worker candidate 2.8.2 and previous 2.8.1 versions and all reviewed public keys are consistent."
          echo "NOTE: version and signing-key continuity are checked against the installed 2.8.1 review baseline and the current PR candidate."

      - name: Verify deployment safety gates are present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "name: Confirm production deployment branch" .github/workflows/deploy-bakery-licensing.yml
          grep -Fq "if: github.ref == 'refs/heads/main'" .github/workflows/deploy-bakery-licensing.yml
          grep -Fq "Run licensing source, security and schema gates before production changes" .github/workflows/deploy-bakery-licensing.yml
          grep -Fq "Verify production signing key configuration and live key pair" .github/workflows/deploy-bakery-licensing.yml
          grep -Fq "Verify deployed bakery app version" .github/workflows/deploy-bakery-licensing.yml
          ! grep -Fq '      - ".github/workflows/deploy-bakery-licensing.yml"' .github/workflows/deploy-bakery-licensing.yml
          echo "PASS: deployment is main-only and preflight/live-signing gates are present."

      - name: Syntax-check storefront and admin browser scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("store/license.html", "/tmp/bakery-store.js"),
              ("store/license-admin.html", "/tmp/bakery-admin.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
              assert scripts, f"No inline script found in {source}"
              Path(target).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/bakery-store.js
          node --check /tmp/bakery-admin.js

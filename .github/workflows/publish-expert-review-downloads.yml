name: Publish public expert-review downloads (gated prerelease)

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "Optional successful Android 2.4.5 build run ID from main"
        required: false
        type: string
      windows_run_id:
        description: "Optional successful Windows 2.3.0 candidate build run ID from main"
        required: false
        type: string
  workflow_run:
    workflows:
      - "Build Al-Mizan Accountant Android Release 2.4.2 - Signed"
      - "Build Al-Mizan Windows Expert Test Candidate 2.3.0"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: al-mizan-expert-review-downloads
  cancel-in-progress: false

jobs:
  publish-review-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve and validate matching successful main-branch builds
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ANDROID_RUN_ID: ${{ inputs.android_run_id }}
          EVENT_WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish_ready=false" >> "$GITHUB_OUTPUT"
          android_run_id="$EVENT_ANDROID_RUN_ID"
          windows_run_id="$EVENT_WINDOWS_RUN_ID"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$TRIGGER_RUN_CONCLUSION" != "success" || -z "$TRIGGER_RUN_ID" ]]; then
              echo "Triggered build did not succeed; no review release will be published."
              exit 0
            fi
            if [[ "$TRIGGER_RUN_NAME" == "Build Al-Mizan Accountant Android Release 2.4.2 - Signed" ]]; then
              android_run_id="$TRIGGER_RUN_ID"
              windows_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=completed&per_page=100" | jq -r --arg sha "$TRIGGER_RUN_SHA" --arg name "Build Al-Mizan Windows Expert Test Candidate 2.3.0" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == $sha and .name == $name and .conclusion == "success")][0].id // empty')"
            elif [[ "$TRIGGER_RUN_NAME" == "Build Al-Mizan Windows Expert Test Candidate 2.3.0" ]]; then
              windows_run_id="$TRIGGER_RUN_ID"
              android_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=completed&per_page=100" | jq -r --arg sha "$TRIGGER_RUN_SHA" --arg name "Build Al-Mizan Accountant Android Release 2.4.2 - Signed" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == $sha and .name == $name and .conclusion == "success")][0].id // empty')"
            else
              echo "Unexpected workflow_run source; no review release will be published."
              exit 0
            fi
            if [[ -z "$android_run_id" || -z "$windows_run_id" ]]; then
              echo "No matching successful Android and Windows builds exist for the same main-branch commit yet. Waiting for the counterpart workflow; no release published."
              exit 0
            fi
          fi

          [[ "$android_run_id" =~ ^[0-9]+$ ]] || { echo "::error::Android run ID must be numeric"; exit 1; }
          [[ "$windows_run_id" =~ ^[0-9]+$ ]] || { echo "::error::Windows run ID must be numeric"; exit 1; }

          validate_run() {
            local id="$1" expected_path="$2" expected_name="$3"
            local data
            data="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")"
            echo "$data" | jq -e --arg path "$expected_path" --arg name "$expected_name" '
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "main" and
              .path == $path and
              .name == $name
            ' >/dev/null || {
              echo "::error::Selected run must be a successful completed build from main with the exact expected workflow."
              exit 1
            }
          }
          validate_run "$android_run_id" ".github/workflows/build-android-apk.yml" "Build Al-Mizan Accountant Android Release 2.4.2 - Signed"
          validate_run "$windows_run_id" ".github/workflows/build-windows-app.yml" "Build Al-Mizan Windows Expert Test Candidate 2.3.0"
          android_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$android_run_id" --jq .head_sha)"
          windows_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$windows_run_id" --jq .head_sha)"
          [[ "$android_sha" == "$windows_sha" ]] || { echo "::error::Android and Windows builds must come from the same main-branch commit."; exit 1; }
          echo "android_run_id=$android_run_id" >> "$GITHUB_OUTPUT"
          echo "windows_run_id=$windows_run_id" >> "$GITHUB_OUTPUT"
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          echo "Both candidates passed their build workflows on the same main commit. Publishing review-only prerelease; commercial sales remain disabled."
          
      - name: Download and verify named build artifacts
        if: steps.resolve.outputs.publish_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN_ID: ${{ steps.resolve.outputs.android_run_id }}
          WINDOWS_RUN_ID: ${{ steps.resolve.outputs.windows_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/android-2.4.5 staging/windows-2.3.0 public-review
          gh run download "$ANDROID_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "al-mizan-android-signed-release-v2.4.5" --dir staging/android-2.4.5
          gh run download "$WINDOWS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "smart-company-windows-v2.3.0" --dir staging/windows-2.3.0

          apk="$(find staging/android-2.4.5 -type f -iname 'AlMizan-2.4.5-release.apk' -print -quit)"
          aab="$(find staging/android-2.4.5 -type f -iname 'AlMizan-2.4.5-release.aab' -print -quit)"
          exe="$(find staging/windows-2.3.0 -type f -iname 'SmartCompany-Windows-2.3.0-x64.exe' -print -quit)"
          zip="$(find staging/windows-2.3.0 -type f -iname 'SmartCompany-Windows-2.3.0-x64.zip' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$aab" && test -s "$aab"
          test -n "$exe" && test -s "$exe"
          test -n "$zip" && test -s "$zip"
          cp "$apk" public-review/AlMizan-review-2.4.5-release.apk
          cp "$aab" public-review/AlMizan-review-2.4.5-release.aab
          cp "$exe" public-review/Windows-review-2.3.0-x64.exe
          cp "$zip" public-review/Windows-review-2.3.0-x64.zip
          for f in staging/android-2.4.5/SIGNING-CERTIFICATE.txt staging/android-2.4.5/SIGNING-CERT-SHA256.txt; do
            if [ -s "$f" ]; then cp "$f" "public-review/$(basename "$f")"; fi
          done
          (cd public-review && sha256sum * > REVIEW-SHA256SUMS.txt)
          cat > public-review/REVIEW-NOTICE.txt <<'NOTICE'
          AL-MIZAN EXPERT REVIEW CANDIDATES — NOT APPROVED FOR COMMERCIAL SALE
          Android 2.4.5 and Windows 2.3.0 are expert-review candidates only.
          Do not use real customer financial records. Review installation/update compatibility,
          accounting calculations and postings, licensing, database integrity, backup/restore,
          privacy and Windows runtime behavior. CI success is not independent QA or sales approval.
          Submit evidence at:
          https://github.com/moh1442010-arch/smart-encyclopedias-platform/issues/18
          NOTICE

      - name: Publish or update the public prerelease for expert review
        if: steps.resolve.outputs.publish_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="al-mizan-final-review-2026-10-22"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" public-review/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" public-review/* --repo "$GITHUB_REPOSITORY" \
              --title "Al-Mizan expert review candidates — NOT FOR SALE" \
              --notes "Public no-account downloads for independent expert review only. Android 2.4.5 and Windows 2.3.0 are not commercial releases. Validate installation/update, accounting flows, licensing, backups, privacy and Windows behavior. Submit evidence to issue #18." \
              --prerelease
          fi

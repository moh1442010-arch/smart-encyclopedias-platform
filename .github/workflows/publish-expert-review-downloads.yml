name: Publish public expert-review downloads (pre-release only)

on:
  workflow_run:
    workflows:
      - Build Al-Mizan Accountant Android Release 2.4.0 - Signed
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: al-mizan-expert-review-downloads
  cancel-in-progress: false

jobs:
  publish-review-candidates:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download latest signed Android candidate and Windows candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/android-2.4.0 staging/windows-2.2.7 public-review
          run_id="$EVENT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-android-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          echo "Downloading signed Android candidate from successful workflow run $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "al-mizan-android-signed-release-v2.4.0" --dir staging/android-2.4.0

          # Windows 2.2.7 remains a clearly labeled historical expert-review candidate.
          gh run download 38950001396 --repo "$GITHUB_REPOSITORY" --name "smart-company-windows-v2.2.7" --dir staging/windows-2.2.7

          apk="$(find staging/android-2.4.0 -type f -iname 'AlMizan-2.4.0-release.apk' -print -quit)"
          aab="$(find staging/android-2.4.0 -type f -iname 'AlMizan-2.4.0-release.aab' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$aab" && test -s "$aab"
          cp "$apk" public-review/AlMizan-review-2.4.0-release.apk
          cp "$aab" public-review/AlMizan-review-2.4.0-release.aab
          while IFS= read -r -d '' f; do
            case "$(basename "$f")" in
              SIGNING-CERTIFICATE.txt|SIGNING-CERT-SHA256.txt)
                cp "$f" "public-review/AlMizan-review-2.4.0-$(basename "$f")"
                ;;
            esac
          done < <(find staging/android-2.4.0 -type f -print0)

          while IFS= read -r -d '' f; do
            cp "$f" "public-review/Windows-review-2.2.7-$(basename "$f")"
          done < <(find staging/windows-2.2.7 -type f \( -iname '*.exe' -o -iname '*.zip' -o -iname '*.txt' \) -print0)

          test -s public-review/AlMizan-review-2.4.0-release.apk
          test -s public-review/AlMizan-review-2.4.0-release.aab
          test "$(find public-review -maxdepth 1 -type f -iname '*.exe' | wc -l)" -ge 1
          (cd public-review && sha256sum AlMizan-review-2.4.0-release.apk AlMizan-review-2.4.0-release.aab > AlMizan-review-2.4.0-SHA256SUMS.txt)
          (cd public-review && sha256sum * > REVIEW-SHA256SUMS.txt)
          cat > public-review/REVIEW-NOTICE.txt <<'NOTICE'
          AL-MIZAN EXPERT REVIEW CANDIDATES — NOT APPROVED FOR COMMERCIAL SALE
          Android 2.4.0 is the current subscription-pricing correction candidate.
          Windows 2.2.7 is a historical review candidate and is not represented as current.
          Review installation/update compatibility, accounting calculations and postings,
          licensing, database integrity, backup/restore, privacy and Windows runtime behavior.
          Do not use with real financial records. Do not treat CI success as independent QA.
          Submit evidence at:
          https://github.com/moh1442010-arch/smart-encyclopedias-platform/issues/18
          NOTICE

      - name: Publish or update the public prerelease for expert review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="al-mizan-expert-review-2026-10-16"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" public-review/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" public-review/* --repo "$GITHUB_REPOSITORY" \
              --title "Al-Mizan expert review candidates — NOT FOR SALE" \
              --notes "Public no-account downloads for independent expert review only. Android 2.4.0 is a review candidate, not a commercial release. Windows 2.2.7 is a historical review candidate. Validate installation/update, accounting flows, licensing, backups, privacy and Windows behavior. Submit evidence to issue #18." \
              --prerelease
          fi

name: Publish latest Android expert-review APK

on:
  workflow_run:
    workflows:
      - "Build Al-Mizan Accountant Android Release 2.4.2 - Signed"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: al-mizan-android-review-apk
  cancel-in-progress: false

jobs:
  publish-android-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name == 'Build Al-Mizan Accountant Android Release 2.4.2 - Signed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main for release metadata
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Resolve release version from Android source of truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import pathlib, re
          text = pathlib.Path("android-app/app/build.gradle").read_text(encoding="utf-8")
          name = re.search(r"versionName\s+'([^']+)'", text)
          code = re.search(r"versionCode\s+(\d+)", text)
          if not name or not code:
              raise SystemExit("Could not resolve Android versionName/versionCode from Gradle.")
          print("VERSION=" + name.group(1))
          print("VERSION_CODE=" + code.group(1))
          PY

      - name: Download signed Android artifact from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging public-review
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "al-mizan-android-signed-release-v${VERSION}" --dir staging
          apk="$(find staging -type f -name "AlMizan-${VERSION}-release.apk" -print -quit)"
          cert="$(find staging -type f -name 'SIGNING-CERT-SHA256.txt' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$cert" && test -s "$cert"
          cp "$apk" "public-review/AlMizan-review-${VERSION}-release.apk"
          cp "$cert" public-review/SIGNING-CERT-SHA256.txt
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          actual="$(tr -d '[:space:]' < public-review/SIGNING-CERT-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" || { echo "::error::Signing certificate fingerprint differs from the verified long-term key."; exit 1; }
          cat > public-review/REVIEW-NOTICE.txt <<NOTICE
          AL-MIZAN ANDROID EXPERT REVIEW APK — NOT FOR COMMERCIAL SALE
          This APK is built from the successful main-branch Android workflow run that triggered this publication.
          Version: ${VERSION}; versionCode is verified by the build workflow.
          Expert review only. Do not use real customer financial records.
          Confirm installation/update compatibility on a test device before wider distribution.
          CI success is not independent accounting QA or commercial-release approval.
          Report findings at:
          https://github.com/moh1442010-arch/smart-encyclopedias-platform/issues/18
          NOTICE
          (cd public-review && sha256sum "AlMizan-review-${VERSION}-release.apk" SIGNING-CERT-SHA256.txt REVIEW-NOTICE.txt > REVIEW-SHA256SUMS.txt)

      - name: Publish or update Android-only review prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="al-mizan-android-review-${VERSION}-2026-10-22"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" public-review/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" public-review/* --repo "$GITHUB_REPOSITORY" \
              --title "Al-Mizan Android ${VERSION} — expert review only" \
              --notes "Android-only expert-review APK from a successful signed main-branch build. Not approved for commercial sale. Validate update installation on real devices and submit evidence to issue #18." \
              --prerelease
          fi

      - name: Update stable public manifest after successful signed publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="public-review/AlMizan-review-${VERSION}-release.apk"
          test -s "$apk"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          tag="al-mizan-android-review-${VERSION}-2026-10-22"
          export RELEASE_TAG="$tag"
          python3 - "$apk_sha" <<'PY'
          import json, pathlib, sys, os
          path = pathlib.Path("android-release-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.update({
            "product": "المحاسب الميزان Enterprise",
            "status": "expert-review-only-not-approved-for-commercial-sale",
            "packageId": "com.mohammedmustafa.smartcompany",
            "versionName": os.environ["VERSION"],
            "versionCode": int(os.environ["VERSION_CODE"]),
            "releaseTag": os.environ["RELEASE_TAG"],
            "releasePage": "https://github.com/moh1442010-arch/smart-encyclopedias-platform/releases/tag/" + os.environ["RELEASE_TAG"],
            "apkUrl": "https://github.com/moh1442010-arch/smart-encyclopedias-platform/releases/download/" + os.environ["RELEASE_TAG"] + "/AlMizan-review-" + os.environ["VERSION"] + "-release.apk",
            "apkSha256": sys.argv[1],
            "expectedSigningCertificateSha256": "159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279",
            "signingCertificateStatus": "actual APK certificate fingerprint enforced by signed build workflow; physical-device compatibility still requires testing",
            "updateCenterUrl": "https://moh1442010-arch.github.io/smart-encyclopedias-platform/android-updates/"
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-release-manifest.json
          if git diff --cached --quiet; then
            echo "Release manifest already matches the published review artifact."
          else
            git commit -m "Publish verified Android review manifest for ${VERSION}"
            git push origin HEAD:main
          fi

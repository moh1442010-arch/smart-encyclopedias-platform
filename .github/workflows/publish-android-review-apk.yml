name: Publish latest Android expert-review APK

on:
  workflow_run:
    workflows:
      - "Build Al-Mizan Accountant Android Release 2.4.1 - Signed"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: al-mizan-android-review-apk
  cancel-in-progress: false

jobs:
  publish-android-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download signed Android artifact from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging public-review
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "al-mizan-android-signed-release-v2.4.1" --dir staging
          apk="$(find staging -type f -name 'AlMizan-2.4.1-release.apk' -print -quit)"
          cert="$(find staging -type f -name 'SIGNING-CERT-SHA256.txt' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$cert" && test -s "$cert"
          cp "$apk" public-review/AlMizan-review-2.4.1-release.apk
          cp "$cert" public-review/SIGNING-CERT-SHA256.txt
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          actual="$(tr -d '[:space:]' < public-review/SIGNING-CERT-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" || { echo "::error::Signing certificate fingerprint differs from the verified long-term key."; exit 1; }
          mkdir -p tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools/cmdline-tools.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q tools/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          "$HOME/android-sdk/build-tools/36.0.0/aapt" dump badging public-review/AlMizan-review-2.4.1-release.apk | grep -F "package: name='com.mohammedmustafa.smartcompany' versionCode='42' versionName='2.4.1'"
          "$HOME/android-sdk/build-tools/36.0.0/apksigner" verify --verbose public-review/AlMizan-review-2.4.1-release.apk
          cat > public-review/REVIEW-NOTICE.txt <<'NOTICE'
          AL-MIZAN ANDROID EXPERT REVIEW APK — NOT FOR COMMERCIAL SALE
          This APK is built from the successful main-branch Android workflow run that triggered this publication.
          Version: 2.4.1 (versionCode 42).
          Expert review only. Do not use real customer financial records.
          Confirm installation/update compatibility on a test device before wider distribution.
          CI success is not independent accounting QA or commercial-release approval.
          Report findings at:
          https://github.com/moh1442010-arch/smart-encyclopedias-platform/issues/18
          NOTICE
          (cd public-review && sha256sum AlMizan-review-2.4.1-release.apk SIGNING-CERT-SHA256.txt REVIEW-NOTICE.txt > REVIEW-SHA256SUMS.txt)

      - name: Publish or update Android-only review prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="al-mizan-android-review-2026-10-18"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" public-review/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" public-review/* --repo "$GITHUB_REPOSITORY" \
              --title "Al-Mizan Android 2.4.1 — expert review only" \
              --notes "Android-only expert-review APK from a successful signed main-branch build. Not approved for commercial sale. Validate update installation on real devices and submit evidence to issue #18." \
              --prerelease
          fi

name: Issue Al-Mizan Bakery Activation Token

on:
  workflow_dispatch:
    inputs:
      device_id:
        description: Device ID shown in the bakery app paywall / WhatsApp request
        required: true
        type: string
      plan:
        description: Approved subscription plan
        required: true
        type: choice
        options:
          - monthly
          - annual
          - lifetime
      expires_on:
        description: Expiry date in UTC YYYY-MM-DD; ignored for lifetime
        required: false
        type: string

permissions:
  contents: read

jobs:
  issue-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Validate request and issue signed token
        shell: bash
        env:
          DEVICE_ID_INPUT: ${{ inputs.device_id }}
          PLAN: ${{ inputs.plan }}
          EXPIRES_ON: ${{ inputs.expires_on }}
          PRIVATE_KEY_B64: ${{ secrets.BAKERY_LICENSE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY_B64" || { echo "::error::Add BAKERY_LICENSE_PRIVATE_KEY_B64 in repository Actions secrets first."; exit 1; }
          DEVICE_ID="$(printf '%s' "$DEVICE_ID_INPUT" | tr -d '[:space:]')"
          [[ "$DEVICE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::Device ID format is invalid after whitespace cleanup."; exit 1; }
          case "$PLAN" in monthly|annual|lifetime) ;; *) echo "::error::Unsupported plan."; exit 1;; esac
          # Accept PEM directly or Base64-encoded PEM. Normalize clipboard whitespace safely.
          KEY_INPUT="$(printf '%s' "$PRIVATE_KEY_B64" | tr -d '\r')"
          if [[ "$KEY_INPUT" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$KEY_INPUT" > license-private.pem
          else
            KEY_B64="$(printf '%s' "$KEY_INPUT" | tr -d '[:space:]' | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')"
            test -n "$KEY_B64" || { echo "::error::Signing secret is empty after Base64 normalization."; exit 1; }
            case $((\${#KEY_B64} % 4)) in
              0) ;;
              2) KEY_B64+="==" ;;
              3) KEY_B64+="=" ;;
              *) echo "::error::Signing secret has an invalid Base64 length."; exit 1 ;;
            esac
            printf '%s' "$KEY_B64" | base64 --decode > license-private.pem || {
              echo "::error::Signing secret could not be Base64-decoded. Re-copy the complete private.pem.b64 file into the Actions secret."; exit 1;
            }
          fi
          openssl pkey -in license-private.pem -check -noout >/dev/null || {
            echo "::error::Decoded secret is not a valid supported private key. No token was issued."; exit 1;
          }
          EXPECTED_PUBLIC_KEY_DER_B64="$(grep -oE 'LICENSE_PUBLIC_KEY_B64 = "[^"]+"' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java | head -1 | cut -d '"' -f2)"
          ACTUAL_PUBLIC_KEY_DER_B64="$(openssl pkey -in license-private.pem -pubout -outform DER | base64 -w0)"
          test -n "$EXPECTED_PUBLIC_KEY_DER_B64" || { echo "::error::Could not read the app's public activation key."; exit 1; }
          test "$ACTUAL_PUBLIC_KEY_DER_B64" = "$EXPECTED_PUBLIC_KEY_DER_B64" || { echo "::error::Activation private key does not match the public key embedded in the app; no token was issued."; exit 1; }
          APP_VERSION="$(grep -oE "versionName '[^']+'" bakery-app/app/build.gradle | head -1 | cut -d "'" -f2)"
          test -n "$APP_VERSION" || { echo "::error::Could not read current bakery app version."; exit 1; }
          if [ "$PLAN" = "lifetime" ]; then
            EXPIRES=0
            MAX_VERSION="$APP_VERSION"
          else
            MAX_VERSION="any"
            [[ "$EXPIRES_ON" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Provide expiry as YYYY-MM-DD for monthly or annual plans."; exit 1; }
            EXPIRES="$(date -u -d "$EXPIRES_ON 23:59:59" +%s)"
            NORMALIZED="$(date -u -d "@$EXPIRES" +%F)"
            test "$NORMALIZED" = "$EXPIRES_ON" || { echo "::error::Expiry date is invalid."; exit 1; }
            test "$EXPIRES" -gt "$(date -u +%s)" || { echo "::error::Expiry must be in the future."; exit 1; }
          fi
          PAYLOAD="app=com.mohammedmustafa.almizan.bakery;device=$DEVICE_ID;plan=$PLAN;expires=$EXPIRES;max_version=$MAX_VERSION"
          printf '%s' "$PAYLOAD" > license-payload.txt
          openssl dgst -sha256 -sign license-private.pem -out license-signature.bin license-payload.txt
          PAYLOAD_B64="$(printf '%s' "$PAYLOAD" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          SIGNATURE_B64="$(openssl base64 -A -in license-signature.bin | tr '+/' '-_' | tr -d '=')"
          TOKEN="$PAYLOAD_B64.$SIGNATURE_B64"
          {
            echo "## Signed activation token"
            echo
            echo "- Device: $DEVICE_ID"
            echo "- Plan: $PLAN"
            echo "- Allowed app version: $MAX_VERSION"
            if [ "$EXPIRES" = "0" ]; then echo "- Expiry: Lifetime"; else echo "- Expiry (UTC): $EXPIRES_ON 23:59:59"; fi
            echo
            echo 'Copy the token below and send it to the customer through the verified support conversation:'
            echo
            echo '~~~text'
            echo "$TOKEN"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f license-private.pem license-payload.txt license-signature.bin

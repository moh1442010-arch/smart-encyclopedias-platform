name: Deploy Hisab Al-Tirbal licensing Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tirbal-licensing/**"
      - ".github/workflows/deploy-tirbal-licensing.yml"

permissions:
  contents: read

concurrency:
  group: deploy-hisab-al-tirbal-licensing
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Worker syntax and D1 schema
        run: |
          set -euo pipefail
          node --check tirbal-licensing/worker/src/index.js
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(":memory:")
          db.executescript(Path("tirbal-licensing/schema.sql").read_text(encoding="utf-8"))
          names={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"tirbal_devices","tirbal_orders","tirbal_audit"} <= names
          print("PASS: isolated Tirbal D1 schema")
          PY

      - name: Validate and normalize the Tirbal RSA signing key
        env:
          RAW_KEY: ${{ secrets.TIRBAL_LICENSE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require("node:crypto"),fs=require("node:fs"),path=require("node:path");
          const raw=String(process.env.RAW_KEY||"").trim().replace(/\s+/g,"");
          if(!raw) throw new Error("Missing TIRBAL_LICENSE_PRIVATE_KEY_B64 GitHub secret");
          const der=Buffer.from(raw,"base64");
          const key=crypto.createPrivateKey({key:der,format:"der",type:"pkcs8"});
          const worker=fs.readFileSync("tirbal-licensing/worker/src/index.js","utf8");
          const match=worker.match(/PUBLIC_KEY_DER_B64 = "([^"]+)"/);
          if(!match) throw new Error("Worker public key missing");
          const pub=crypto.createPublicKey({key:Buffer.from(match[1],"base64"),format:"der",type:"spki"});
          const probe=Buffer.from("Hisab Al-Tirbal signing pair check");
          if(!crypto.verify("RSA-SHA256",probe,pub,crypto.sign("RSA-SHA256",probe,key)))
            throw new Error("Tirbal private key does not match app public key");
          const normalized=key.export({format:"der",type:"pkcs8"}).toString("base64");
          const file=path.join(process.env.RUNNER_TEMP,"tirbal-private.b64");
          fs.writeFileSync(file,normalized,{mode:0o600});
          console.log("PASS: Tirbal RSA key matches the Android public key.");
          NODE

      - name: Normalize Cloudflare API token
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//I')"
          if [ -z "$token" ]; then echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          unset token RAW_CF_TOKEN

      - name: Verify Cloudflare API token before D1 changes
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output "$RUNNER_TEMP/tirbal-cf-verify.json" --write-out '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")"
          node -e 'const fs=require("node:fs");let x={};try{x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};if(process.argv[2]!=="200"||x.success!==true||x.result?.status!=="active")process.exit(1)' "$RUNNER_TEMP/tirbal-cf-verify.json" "$code"
          rm -f "$RUNNER_TEMP/tirbal-cf-verify.json"

      - name: Validate required admin and payment configuration before deployment
        env:
          ADMIN_PASSWORD: ${{ secrets.TIRBAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_PASSWORD" ] || [ "${#ADMIN_PASSWORD}" -lt 32 ]; then
            echo "::error::Configure TIRBAL_ADMIN_PASSWORD as a random value of at least 32 characters."
            exit 1
          fi

      - name: Create or reuse a dedicated Tirbal D1 database
        working-directory: tirbal-licensing
        env:
          CLOUDFLARE_ACCOUNT_ID: b2f59f3997ad2918941d4d261370d1b4
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/tirbal-d1-list.json"
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output "$response" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")"
          if [ "$code" != "200" ]; then echo "::error::Unable to list Cloudflare D1 databases"; exit 1; fi
          db_id="$(node -e 'const x=require(process.argv[1]);if(x.success!==true)process.exit(1);const d=(x.result||[]).find(v=>v.name==="hisab-al-tirbal-licenses");if(d)process.stdout.write(d.uuid)' "$response")"
          if [ -z "$db_id" ]; then
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output "$response" --write-out '%{http_code}' -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"hisab-al-tirbal-licenses"}')"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "::error::Unable to create dedicated Tirbal D1 database"; exit 1; fi
            db_id="$(node -e 'const x=require(process.argv[1]);if(x.success!==true||!x.result?.uuid)process.exit(1);process.stdout.write(x.result.uuid)' "$response")"
          fi
          if [ "$db_id" = "690347da-5de8-41de-b9c0-b2421db66f57" ]; then echo "::error::Refusing to use the bakery licensing database"; exit 1; fi
          DB_ID="$db_id" python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path("wrangler.toml")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'database_name = "[^"]+"','database_name = "hisab-al-tirbal-licenses"',s)
          s=re.sub(r'database_id = "[^"]+"',f'database_id = "{os.environ["DB_ID"]}"',s)
          p.write_text(s,encoding="utf-8")
          print("Configured a dedicated D1 database for Hisab Al-Tirbal.")
          PY
          rm -f "$response"

      - name: Apply isolated Tirbal D1 schema
        working-directory: tirbal-licensing
        env:
          CLOUDFLARE_ACCOUNT_ID: b2f59f3997ad2918941d4d261370d1b4
        run: npx --yes wrangler@4 d1 execute hisab-al-tirbal-licenses --remote --file=schema.sql --config wrangler.toml

      - name: Configure Worker secrets
        working-directory: tirbal-licensing
        env:
          CLOUDFLARE_ACCOUNT_ID: b2f59f3997ad2918941d4d261370d1b4
          ADMIN_PASSWORD: ${{ secrets.TIRBAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret put TIRBAL_LICENSE_PRIVATE_KEY_PKCS8_B64 --config wrangler.toml < "$RUNNER_TEMP/tirbal-private.b64"
          rm -f "$RUNNER_TEMP/tirbal-private.b64"
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put TIRBAL_ADMIN_PASSWORD --config wrangler.toml

      - name: Deploy Tirbal licensing Worker
        working-directory: tirbal-licensing
        env:
          CLOUDFLARE_ACCOUNT_ID: b2f59f3997ad2918941d4d261370d1b4
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify live service and signing pair
        run: |
          set -euo pipefail
          base="https://hisab-al-tirbal-licensing.moh1442010.workers.dev"
          curl --fail --silent --show-error "$base/health" | tee "$RUNNER_TEMP/tirbal-health.json"
          curl --fail --silent --show-error "$base/diagnostics/signing-pair" | tee "$RUNNER_TEMP/tirbal-signing.json"
          node -e 'const h=require(process.argv[1]),s=require(process.argv[2]);if(h.ok!==true||h.service!=="hisab-al-tirbal-licensing"||h.appVersion!=="1.8.2"||s.signingReady!==true)process.exit(1)' "$RUNNER_TEMP/tirbal-health.json" "$RUNNER_TEMP/tirbal-signing.json"
          curl --fail --silent --show-error "$base/api/config" | tee "$RUNNER_TEMP/tirbal-config.json"
          node -e 'const x=require(process.argv[1]);const p=x.payment||{};if(x.appVersion!=="1.8.2"||x.trialDays!==7||x.plans?.monthly?.amount!==70000||x.plans?.annual?.amount!==650000||x.plans?.lifetime?.amount!==1300000||![p.bankName,p.accountName,p.accountNumber,p.whatsapp].every(v=>typeof v==="string"&&v.trim()))process.exit(1)' "$RUNNER_TEMP/tirbal-config.json"

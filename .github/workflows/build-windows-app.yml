name: Build Al-Mizan Windows Expert Test Candidate 2.2.9

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-app/**"
      - "windows-app.tests/**"
      - ".github/workflows/build-windows-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create application icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(11,31,58))
          $gold = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(212,175,55))
          $g.FillRectangle($gold,48,48,160,28)
          $g.FillRectangle($gold,48,94,160,28)
          $g.FillRectangle($gold,48,140,100,28)
          $g.FillRectangle($gold,164,140,44,28)
          $g.Dispose()
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = New-Object System.IO.FileStream("$PWD/windows-app/smartcompany.ico",[System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Close()
          $icon.Dispose()
          $bmp.Dispose()

      - name: Restore dependencies
        working-directory: windows-app
        run: dotnet restore SmartCompany.csproj

      - name: Build Release
        working-directory: windows-app
        run: dotnet build SmartCompany.csproj -c Release --no-restore -p:Version=2.2.9

      - name: Run Windows accounting regression tests
        run: dotnet run --project windows-app.tests/WindowsAccountingTests.csproj -c Release

      - name: Publish self-contained Windows x64
        working-directory: windows-app
        run: dotnet publish SmartCompany.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:Version=2.2.9

      - name: Package and verify
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = "windows-app/bin/Release/net8.0-windows/win-x64/publish/SmartCompany.exe"
          if (!(Test-Path $exe)) { throw "Published executable was not found." }
          if ((Get-Item $exe).Length -lt 1000000) { throw "Published executable is unexpectedly small." }
          Copy-Item $exe release/SmartCompany-Windows-2.2.9-x64.exe
          Set-Content release/README.txt "Smart Company Windows x64 - v2.2.9. Pre-commercial build. Operational reports are preliminary and are not approved financial statements. Test only with a backup." -Encoding utf8
          Compress-Archive -Path release/SmartCompany-Windows-2.2.9-x64.exe,release/README.txt -DestinationPath release/SmartCompany-Windows-2.2.9-x64.zip -Force
          Get-FileHash release/SmartCompany-Windows-2.2.9-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  SmartCompany-Windows-2.2.9-x64.exe" } | Set-Content release/SHA256SUMS.txt
          Get-Item release/SmartCompany-Windows-2.2.9-x64.exe,release/SmartCompany-Windows-2.2.9-x64.zip,release/SHA256SUMS.txt | Format-Table Name,Length

      - name: Verify Windows package contents and SHA-256 manifest
        shell: powershell
        run: |
          $exe = "release/SmartCompany-Windows-2.2.9-x64.exe"
          $zip = "release/SmartCompany-Windows-2.2.9-x64.zip"
          $readme = "release/README.txt"
          $manifest = "release/SHA256SUMS.txt"
          foreach ($path in @($exe,$zip,$readme,$manifest)) {
            if (!(Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Required Windows release file is missing or empty: $path"
            }
          }
          $expected = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = Get-Content $manifest | Select-Object -First 1
          if ($line -notmatch "^$expected\s+SmartCompany-Windows-2.2.9-x64\.exe$") {
            throw "Windows executable SHA-256 manifest does not match the executable."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains "SmartCompany-Windows-2.2.9-x64.exe" -or $names -notcontains "README.txt") {
              throw "Windows ZIP package is missing the executable or README."
            }
          } finally {
            $archive.Dispose()
          }
          Write-Output "Windows executable, README, ZIP contents and SHA-256 manifest verified."
          
      - name: Windows executable launch smoke test
        shell: powershell
        run: |
          $exe = (Resolve-Path "release/SmartCompany-Windows-2.2.9-x64.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Windows app exited during launch smoke test with code $($proc.ExitCode)." }
          Stop-Process -Id $proc.Id -Force
          Write-Output "Windows GUI process stayed alive for 8 seconds; launch smoke test passed."

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: smart-company-windows-v2.2.9
          path: release/*
          if-no-files-found: error
          retention-days: 90

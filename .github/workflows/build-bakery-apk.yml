name: Build Al-Mizan Bakery 2.8.3 Device-Review APK (no commercial release)
# Compile the mandatory update-policy client as part of the candidate APK verification.

on:
  workflow_dispatch:
  push:
    paths:
      - "bakery-app/**"
      - "tools/bakery-license-issuer.mjs"
      - ".github/workflows/build-bakery-apk.yml"
  pull_request:
    paths:
      - "bakery-app/**"
      - "tools/bakery-license-issuer.mjs"
      - ".github/workflows/build-bakery-apk.yml"

permissions:
  contents: read

concurrency:
  # Keep only the newest candidate run per ref; stale commits must not occupy emulator/build capacity.
  group: al-mizan-bakery-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Dedicated review branch and the active 2.9 feature branch may build non-commercial review APKs only.
    if: github.ref == 'refs/heads/review/bakery-2.8.2-device-acceptance' || github.ref == 'refs/heads/feature/almizan-2.9-competitive-localization' || github.event.pull_request.head.ref == 'review/bakery-2.8.2-device-acceptance' || github.event.pull_request.head.ref == 'feature/almizan-2.9-competitive-localization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for activation issuer validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate offline activation issuer syntax
        run: node --check tools/bakery-license-issuer.mjs
      - name: Validate Termux offline issuance helper syntax
        run: bash -n tools/issue-bakery-license-termux.sh
      - name: Verify offline issuer matches app version and public key
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('bakery-app/app/build.gradle', 'utf8');
          const gate = fs.readFileSync('bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/LicenseAccessGate.java', 'utf8');
          const issuer = fs.readFileSync('tools/bakery-license-issuer.mjs', 'utf8');
          const appVersion = app.match(/versionName '([^']+)'/)?.[1];
          const issuerVersion = issuer.match(/CURRENT_APP_VERSION = "([^"]+)"/)?.[1];
          const appKey = gate.match(/"([A-Za-z0-9+/=]{100,})"/)?.[1];
          const issuerKey = issuer.match(/EXPECTED_PUBLIC_KEY_DER_B64 = "([^"]+)"/)?.[1];
          if (!appVersion || !issuerVersion || appVersion !== issuerVersion) {
            throw new Error(`Offline issuer version mismatch: app=${appVersion}, issuer=${issuerVersion}`);
          }
          if (!appKey || !issuerKey || appKey !== issuerKey) {
            throw new Error('Offline issuer public key does not match the key embedded in the app.');
          }
          console.log(`Offline activation issuer matches app ${appVersion} and its public key.`);
          NODE

      - name: Verify release identity and approved bakery prices
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gradle = fs.readFileSync('bakery-app/app/build.gradle', 'utf8');
          const app = fs.readFileSync('bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java', 'utf8');
          const worker = fs.readFileSync('licensing/worker/src/index.js', 'utf8');
          const workerConfig = fs.readFileSync('licensing/worker/wrangler.toml', 'utf8');
          const licenseSchema = fs.readFileSync('licensing/schema.sql', 'utf8');
          const licenseGate = fs.readFileSync('bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/LicenseAccessGate.java', 'utf8');
          const appKey = licenseGate.match(/"([A-Za-z0-9+/=]{100,})"/)?.[1];
          const workerKey = worker.match(/EXPECTED_APP_PUBLIC_KEY_DER_B64 = "([^"]+)"/)?.[1];
          if (!appKey || appKey !== workerKey) throw new Error("Worker signing public key does not match Android app.");
          if (!workerConfig.includes('APP_VERSION = "2.8.3"')) throw new Error("Worker APP_VERSION must be 2.8.3.");
          if (!workerConfig.includes('PREVIOUS_APP_VERSION = "2.8.2"')) throw new Error("Worker must preserve upgrade compatibility from installed 2.8.2 customers.");
          const expected = {
            applicationId: "com.mohammedmustafa.almizan.bakery",
            versionName: "2.8.3"
          };
          for (const [key, value] of Object.entries(expected)) {
            if (!gradle.includes(`${key} '${value}'`)) throw new Error(`Release identity mismatch: ${key}`);
          }
          if (!gradle.includes("versionCode 280003")) throw new Error("Release identity mismatch: versionCode");
          if (!app.includes("return new long[]{55000,550000,1050000}")) throw new Error("App SDG license prices mismatch.");
          if (!app.includes("return new long[]{29,290,725}")) throw new Error("App SAR/AED license prices mismatch.");
          if (!app.includes("return new long[]{8,80,199}")) throw new Error("App USD license prices mismatch.");
          for (const row of [
            "('SDG','monthly',55000", "('SDG','annual',550000", "('SDG','lifetime',1050000",
            "('SAR','monthly',29", "('SAR','annual',290", "('SAR','lifetime',725",
            "('AED','monthly',29", "('AED','annual',290", "('AED','lifetime',725",
            "('USD','monthly',8", "('USD','annual',80", "('USD','lifetime',199"
          ]) {
            if (!licenseSchema.includes(row)) throw new Error(`D1 licensing price catalog is missing approved row ${row}`);
          }
          if (!worker.includes("FROM license_price_catalog")) throw new Error("Worker must read license prices from D1.");
          if (!worker.includes("CURRENCY_NOT_ALLOWED_FOR_COUNTRY")) throw new Error("Server country/currency policy is missing.");
          console.log("Release identity and all approved SDG/SAR/AED/USD license prices verified.");
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Validate factory module schema and requested screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            "bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java": [
              'DB(Context c){super(c,"almizan_factory_1.db",SecureDatabase.passphrase(c,"almizan_factory_1.db"),null,13,0,null,null,false);}',
              'FactoryGlOutbox.postSourceJournal',
              'postPairJournal(d,"BATCH-"+batchId+"-FINISHED"',
            ],
            "bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java": [
              'root.put("schema_version", 13)',
              'root.optInt("schema_version") > 13',
              'factory_gl_outbox_lines',
            ],
            "bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryGlOutbox.java": [
              'static void ensureSchema',
              'static long postSourceJournal',
              'static BackfillResult backfillPostedJournals',
              'j.status=\'REVERSED\'',
              'static ReconciliationReport reconcile',
              'GeneralLedger.post(destination,entry)',
              'payload_version',
              'عملة مصدر دفتر المصنع ثابتة SDG',
              'DEAD_LETTER',
            ],
            "bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java": [
              'private void glBridge()',
              'FactoryGlOutbox.backfillPostedJournals(db,100)',
              'FactoryGlOutbox.enqueue(db,id);',
              'FactoryGlOutbox.reconcile(db,destination)',
            ],
            "bakery-app/app/src/androidTest/java/com/mohammedmustafa/almizan/bakery/FactoryGlOutboxInstrumentedTest.java": [
              'existingFactoryDatabaseV12UpgradesAdditivelyToV13',
              'backfillCapturesValidLegacyJournalsWithoutChangingHistoryAndLeavesInvalidOnesVisible',
              'reconciliationDetectsDestinationTransactionAmountMismatch',
              'foreignBaseCurrencyRejectsUnverifiedOneToOneFactoryRate',
              'nonSdgImportedMappingCannotPostFactoryAmountsAsAnotherCurrency',
            ],
            "bakery-app/app/src/androidTest/java/com/mohammedmustafa/almizan/bakery/FactoryBackupRestoreTest.java": [
              'assertEquals(13,snapshot.getInt("schema_version"))',
              'legacySnapshot.put("schema_version",11)',
              'FactoryBackup.restore(context,legacySnapshot)',
            ],
            "bakery-app/app/src/main/AndroidManifest.xml": ['FactoryLedgerActivity'],
            "bakery-app/app/build.gradle": ['minSdk 28', 'targetSdk 35'],
          }
          for filename, needles in checks.items():
              content = Path(filename).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"Missing required implementation marker: {filename}: {needle}")
          print("Factory outbox, backfill, reconciliation, backup migration and API declarations verified.")
          PY
          if grep -R -E 'Math\.(addExact|subtractExact|multiplyExact)\(' bakery-app/app/src/main/java; then
            echo "Checked arithmetic must remain compatible with Android API 28."
            exit 1
          fi

      - name: Guard factory report and print line breaks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java',
            'bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java'
          ];
          const literalBackslashN = String.raw`\\n`;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (source.includes(literalBackslashN)) {
              throw new Error(`Double-escaped newline found in ${file}; report output would show literal \\\\n.`);
            }
          }
          console.log('Factory report and print strings contain no double-escaped newline sequences.');
          NODE

      - name: Run arithmetic unit tests
        working-directory: bakery-app
        run: gradle testDebugUnitTest

      - name: Build debug and release APK
        working-directory: bakery-app
        run: gradle clean assembleDebug assembleRelease

      - name: Upload internal debug build (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.8.3-debug-internal
          path: bakery-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign and verify review APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: bakery-app
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing signing password secret"; exit 1; }
          ENCRYPTED_KEY="../.github/signing/smartcompany-release.jks.gpg"
          test -s "$ENCRYPTED_KEY" || { echo "::error::Encrypted long-term signing keystore is missing"; exit 1; }
          mkdir -p release signing
          printf '%s' "$KEYSTORE_PASSWORD" | gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$ENCRYPTED_KEY" > signing/release.jks
          test -s signing/release.jks
          keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
          aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
          count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          test "$count" = "1" || { echo "::error::Expected exactly one private-key entry in the keystore"; exit 1; }
          alias="$(printf '%s\n' "$aliases" | sed -n '1p')"
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -f -v 4 "$apk" release/AlMizan-Bakery-2.8.3-aligned.apk
          "$build_tools/apksigner" sign --ks signing/release.jks --ks-key-alias "$alias" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --out release/AlMizan-Bakery-2.8.3-review.apk release/AlMizan-Bakery-2.8.3-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs release/AlMizan-Bakery-2.8.3-review.apk | tee release/SIGNING-CERTIFICATE.txt
          cert_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' release/SIGNING-CERTIFICATE.txt | tr -d ':[:space:]')"
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          test "$cert_sha" = "$expected" || { echo "::error::Signing certificate fingerprint mismatch; do not distribute this APK"; exit 1; }
          badging="$("$build_tools/aapt" dump badging release/AlMizan-Bakery-2.8.3-review.apk)"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.almizan.bakery' versionCode='280003' versionName='2.8.3'"
          echo "$badging" | grep -F "application-label:'المحاسب الميزان للمخابز'"
          sha256sum release/AlMizan-Bakery-2.8.3-review.apk > release/SHA256SUMS.txt
          rm -f release/AlMizan-Bakery-2.8.3-aligned.apk signing/release.jks

      - name: Upload signed review APK and verification records
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.8.3-signed-review
          path: |
            bakery-app/release/AlMizan-Bakery-2.8.3-review.apk
            bakery-app/release/SHA256SUMS.txt
            bakery-app/release/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Smoke test signed APK on minimum Android API 28
        # Run the full SQLCipher/ledger/backup instrumentation suite on the declared minimum API.
        # Hosted runners can intermittently expose the emulator before its Android properties are ready.
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Full database instrumentation is owned by test-bakery-foundation.yml.
          # This step only verifies installation and launch of the exact signed review APK.
          script: |
            adb uninstall com.mohammedmustafa.almizan.bakery || true
            adb install -r bakery-app/release/AlMizan-Bakery-2.8.3-review.apk
            adb logcat -c
            adb shell monkey -p com.mohammedmustafa.almizan.bakery 1
            sleep 8
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.mohammedmustafa.almizan.bakery'; then echo "Application crash detected"; exit 1; fi
            adb shell dumpsys package com.mohammedmustafa.almizan.bakery | grep -F "versionName=2.8.3"

      - name: Smoke test signed APK on modern Android API 35
        # API 35 is a mandatory compatibility gate; infrastructure failures must remain visible.
        # API 35 emulator boot can be slow on hosted runners; allow the boot itself to finish.
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r bakery-app/release/AlMizan-Bakery-2.8.3-review.apk
            adb logcat -c
            adb shell monkey -p com.mohammedmustafa.almizan.bakery 1
            sleep 8
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.mohammedmustafa.almizan.bakery'; then echo "Application crash detected"; exit 1; fi
            adb shell dumpsys package com.mohammedmustafa.almizan.bakery | grep -F "versionName=2.8.3"

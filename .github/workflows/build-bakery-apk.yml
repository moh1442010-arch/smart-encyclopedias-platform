name: Build Al-Mizan Bakery 2.6.9 Review APK

on:
  workflow_dispatch:
  push:
    paths:
      - "bakery-app/**"
      - "tools/bakery-license-issuer.mjs"
      - ".github/workflows/build-bakery-apk.yml"
  pull_request:
    paths:
      - "bakery-app/**"
      - "tools/bakery-license-issuer.mjs"
      - ".github/workflows/build-bakery-apk.yml"

permissions:
  contents: write

concurrency:
  group: al-mizan-bakery-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for activation issuer validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate offline activation issuer syntax
        run: node --check tools/bakery-license-issuer.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: bakery-app
        run: gradle wrapper --gradle-version 8.9

      - name: Run arithmetic unit tests
        working-directory: bakery-app
        run: ./gradlew testDebugUnitTest

      - name: Build debug and release APK
        working-directory: bakery-app
        run: ./gradlew clean assembleDebug assembleRelease

      - name: Upload internal debug build (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.6.9-debug-internal
          path: bakery-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign and verify review APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: bakery-app
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing signing password secret"; exit 1; }
          ENCRYPTED_KEY="../.github/signing/smartcompany-release.jks.gpg"
          test -s "$ENCRYPTED_KEY" || { echo "::error::Encrypted long-term signing keystore is missing"; exit 1; }
          mkdir -p release signing
          printf '%s' "$KEYSTORE_PASSWORD" | gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$ENCRYPTED_KEY" > signing/release.jks
          test -s signing/release.jks
          keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
          aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
          count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          test "$count" = "1" || { echo "::error::Expected exactly one private-key entry in the keystore"; exit 1; }
          alias="$(printf '%s\n' "$aliases" | sed -n '1p')"
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -f -v 4 "$apk" release/AlMizan-Bakery-2.6.9-aligned.apk
          "$build_tools/apksigner" sign --ks signing/release.jks --ks-key-alias "$alias" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --out release/AlMizan-Bakery-2.6.9-review.apk release/AlMizan-Bakery-2.6.9-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs release/AlMizan-Bakery-2.6.9-review.apk | tee release/SIGNING-CERTIFICATE.txt
          cert_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' release/SIGNING-CERTIFICATE.txt | tr -d ':[:space:]')"
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          test "$cert_sha" = "$expected" || { echo "::error::Signing certificate fingerprint mismatch; do not distribute this APK"; exit 1; }
          badging="$("$build_tools/aapt" dump badging release/AlMizan-Bakery-2.6.9-review.apk)"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.almizan.bakery' versionCode='260009' versionName='2.6.9'"
          echo "$badging" | grep -F "application-label:'المحاسب الميزان للمخابز'"
          sha256sum release/AlMizan-Bakery-2.6.9-review.apk > release/SHA256SUMS.txt
          rm -f release/AlMizan-Bakery-2.6.9-aligned.apk signing/release.jks

      - name: Upload signed review APK and verification records
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.6.9-signed-review
          path: |
            bakery-app/release/AlMizan-Bakery-2.6.9-review.apk
            bakery-app/release/SHA256SUMS.txt
            bakery-app/release/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish review-only GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/bakery-2.6.2-profit-and-entry-fixes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: al-mizan-bakery-2.6.9-review
          name: المحاسب الميزان للمخابز 2.6.9 — مراجعة
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          body: |
            رابط تنزيل مباشر: https://github.com/moh1442010-arch/smart-encyclopedias-platform/releases/download/al-mizan-bakery-2.6.9-review/AlMizan-Bakery-2.6.9-review.apk
            نسخة مراجعة فقط — ليست موافقة على البيع التجاري.
            - تطبيق Android مستقل بمعرّف حزمة منفصل عن المحاسب الميزان العام.
            - اختبارات حسابية آلية تشمل مثال المخزن 10 جوالات وشغل 7 والمتبقي 3، ومعادلة هامش الربح.
            - تحسين واجهة البداية بهوية سنابل القمح والرغيف وأزرار سريعة للمخزن وشغل اليوم.
            - خيار مشاركة شعار المخبز عبر قائمة المشاركة داخل شاشة الاشتراك؛ لا يُعد ذلك تفعيلًا تلقائيًا.
            - البيانات تحفظ محليًا على الهاتف؛ اختبر النسخ الاحتياطي واستعادة البيانات قبل الاعتماد.
            - يلزم اختبار عملي على جهاز حقيقي قبل اعتماد التوافق والتحديث.
          files: |
            bakery-app/release/AlMizan-Bakery-2.6.9-review.apk
            bakery-app/release/SHA256SUMS.txt
            bakery-app/release/SIGNING-CERTIFICATE.txt

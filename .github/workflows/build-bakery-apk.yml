          grep -Fq 'addsEnterpriseTablesWithoutChangingExistingBakeryRecords' bakery-app/app/src/androidTest/java/com/mohammedmustafa/almizan/bakery/EnterpriseSchemaMigrationTest.java
          grep -Fq 'convertsCurrenciesUsingRationalRatesAndMinorUnits' bakery-app/app/src/test/java/com/mohammedmustafa/almizan/bakery/EnterpriseMathTest.java
          grep -Fq 'PortableBackupCrypto.encrypt' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq 'PortableBackupCrypto.decrypt' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq 'almizan_backup_manifest' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq '"0 جوال"' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq 'MIZANBK1' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/PortableBackupCrypto.java
          grep -Fq 'encryptsAndDecryptsPortableBackup' bakery-app/app/src/test/java/com/mohammedmustafa/almizan/bakery/PortableBackupCryptoTest.java
          grep -Fq 'كل نسخة تخص نظاماً واحداً فقط' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq '7L * 24L * 60L * 60L * 1000L' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq '27. التجربة المجانية والاشتراك' bakery-app/app/src/main/assets/bakery-guide.html
          grep -Fq '28. حالة حماية قاعدة البيانات' bakery-app/app/src/main/assets/bakery-guide.html
          grep -Fq 'minSdk 28' bakery-app/app/build.gradle
          grep -Fq 'targetSdk 35' bakery-app/app/build.gradle
          if grep -R -E 'Math\.(addExact|subtractExact|multiplyExact)\(' bakery-app/app/src/main/java; then
            echo "Checked arithmetic must remain compatible with Android API 28."
            exit 1
          fi
          grep -Fq 'root.optInt("schema_version")<6 && "work_order_stages".equals(TABLES[i])' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java
          echo "Factory modules, schema v13 backup compatibility and Android API 28 declarations verified."

      - name: Guard factory report and print line breaks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java',
            'bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java'
          ];
          const literalBackslashN = String.raw`\\n`;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (source.includes(literalBackslashN)) {
              throw new Error(`Double-escaped newline found in ${file}; report output would show literal \\\\n.`);
            }
          }
          console.log('Factory report and print strings contain no double-escaped newline sequences.');
          NODE

      - name: Run arithmetic unit tests
        working-directory: bakery-app
        run: gradle testDebugUnitTest

      - name: Build debug and release APK
        working-directory: bakery-app
        run: gradle clean assembleDebug assembleRelease

      - name: Upload internal debug build (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.8.3-debug-internal
          path: bakery-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign and verify review APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: bakery-app
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing signing password secret"; exit 1; }
          ENCRYPTED_KEY="../.github/signing/smartcompany-release.jks.gpg"
          test -s "$ENCRYPTED_KEY" || { echo "::error::Encrypted long-term signing keystore is missing"; exit 1; }
          mkdir -p release signing
          printf '%s' "$KEYSTORE_PASSWORD" | gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$ENCRYPTED_KEY" > signing/release.jks
          test -s signing/release.jks
          keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
          aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
          count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          test "$count" = "1" || { echo "::error::Expected exactly one private-key entry in the keystore"; exit 1; }
          alias="$(printf '%s\n' "$aliases" | sed -n '1p')"
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -f -v 4 "$apk" release/AlMizan-Bakery-2.8.3-aligned.apk
          "$build_tools/apksigner" sign --ks signing/release.jks --ks-key-alias "$alias" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --out release/AlMizan-Bakery-2.8.3-review.apk release/AlMizan-Bakery-2.8.3-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs release/AlMizan-Bakery-2.8.3-review.apk | tee release/SIGNING-CERTIFICATE.txt
          cert_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' release/SIGNING-CERTIFICATE.txt | tr -d ':[:space:]')"
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          test "$cert_sha" = "$expected" || { echo "::error::Signing certificate fingerprint mismatch; do not distribute this APK"; exit 1; }
          badging="$("$build_tools/aapt" dump badging release/AlMizan-Bakery-2.8.3-review.apk)"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.almizan.bakery' versionCode='280003' versionName='2.8.3'"
          echo "$badging" | grep -F "application-label:'المحاسب الميزان للمخابز'"
          sha256sum release/AlMizan-Bakery-2.8.3-review.apk > release/SHA256SUMS.txt
          rm -f release/AlMizan-Bakery-2.8.3-aligned.apk signing/release.jks

      - name: Upload signed review APK and verification records
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.8.3-signed-review
          path: |
            bakery-app/release/AlMizan-Bakery-2.8.3-review.apk
            bakery-app/release/SHA256SUMS.txt
            bakery-app/release/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Smoke test signed APK on minimum Android API 28
        # Run the full SQLCipher/ledger/backup instrumentation suite on the declared minimum API.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            (cd bakery-app && gradle connectedDebugAndroidTest)
            adb uninstall com.mohammedmustafa.almizan.bakery || true
            adb install -r bakery-app/release/AlMizan-Bakery-2.8.3-review.apk
            adb logcat -c
            adb shell monkey -p com.mohammedmustafa.almizan.bakery 1
            sleep 8
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.mohammedmustafa.almizan.bakery'; then echo "Application crash detected"; exit 1; fi
            adb shell dumpsys package com.mohammedmustafa.almizan.bakery | grep -F "versionName=2.8.3"

      - name: Smoke test signed APK on modern Android API 35
        # API 35 is a mandatory compatibility gate; infrastructure failures must remain visible.
        # API 35 emulator boot can be slow on hosted runners; allow the boot itself to finish.
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r bakery-app/release/AlMizan-Bakery-2.8.3-review.apk
            adb logcat -c
            adb shell monkey -p com.mohammedmustafa.almizan.bakery 1
            sleep 8
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.mohammedmustafa.almizan.bakery'; then echo "Application crash detected"; exit 1; fi
            adb shell dumpsys package com.mohammedmustafa.almizan.bakery | grep -F "versionName=2.8.3"

          grep -Fq 'assertEquals(13,snapshot.getInt("schema_version"))' bakery-app/app/src/androidTest/java/com/mohammedmustafa/almizan/bakery/FactoryBackupRestoreTest.java
          grep -Fq 'factory_gl_outbox_lines' bakery-app/app/src/androidTest/java/com/mohammedmustafa/almizan/bakery/FactoryBackupRestoreTest.java

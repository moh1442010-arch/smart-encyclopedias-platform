name: Build Al-Mizan Bakery 2.8.0 Review APK

on:
  workflow_dispatch:
  push:
    paths:
      - "bakery-app/**"
      - "tools/bakery-license-issuer.mjs"
      - ".github/workflows/build-bakery-apk.yml"
  pull_request:
    paths:
      - "bakery-app/**"
      - "tools/bakery-license-issuer.mjs"
      - ".github/workflows/build-bakery-apk.yml"

permissions:
  contents: write

concurrency:
  group: al-mizan-bakery-release-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for activation issuer validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate offline activation issuer syntax
        run: node --check tools/bakery-license-issuer.mjs
      - name: Validate Termux offline issuance helper syntax
        run: bash -n tools/issue-bakery-license-termux.sh
      - name: Verify offline issuer matches app version and public key
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('bakery-app/app/build.gradle', 'utf8');
          const main = fs.readFileSync('bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java', 'utf8');
          const issuer = fs.readFileSync('tools/bakery-license-issuer.mjs', 'utf8');
          const appVersion = app.match(/versionName '([^']+)'/)?.[1];
          const issuerVersion = issuer.match(/CURRENT_APP_VERSION = "([^"]+)"/)?.[1];
          const appKey = main.match(/LICENSE_PUBLIC_KEY_B64 = "([^"]+)"/)?.[1];
          const issuerKey = issuer.match(/EXPECTED_PUBLIC_KEY_DER_B64 = "([^"]+)"/)?.[1];
          if (!appVersion || !issuerVersion || appVersion !== issuerVersion) {
            throw new Error(`Offline issuer version mismatch: app=${appVersion}, issuer=${issuerVersion}`);
          }
          if (!appKey || !issuerKey || appKey !== issuerKey) {
            throw new Error('Offline issuer public key does not match the key embedded in the app.');
          }
          console.log(`Offline activation issuer matches app ${appVersion} and its public key.`);
          NODE

      - name: Verify release identity and approved bakery prices
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gradle = fs.readFileSync('bakery-app/app/build.gradle', 'utf8');
          const app = fs.readFileSync('bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java', 'utf8');
          const worker = fs.readFileSync('licensing/worker/src/index.js', 'utf8');
          const workerConfig = fs.readFileSync('licensing/worker/wrangler.toml', 'utf8');
          const appMain = fs.readFileSync('bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java', 'utf8');
          const appKey = appMain.match(/LICENSE_PUBLIC_KEY_B64 = "([^"]+)"/)?.[1];
          const workerKey = worker.match(/EXPECTED_APP_PUBLIC_KEY_DER_B64 = "([^"]+)"/)?.[1];
          if (!appKey || appKey !== workerKey) throw new Error("Worker signing public key does not match Android app.");
          if (!workerConfig.includes('APP_VERSION = "2.8.0"')) throw new Error("Worker APP_VERSION must be 2.8.0.");
          const expected = {
            applicationId: "com.mohammedmustafa.almizan.bakery",
            versionName: "2.8.0"
          };
          for (const [key, value] of Object.entries(expected)) {
            if (!gradle.includes(`${key} '${value}'`)) throw new Error(`Release identity mismatch: ${key}`);
          }
          if (!gradle.includes("versionCode 280000")) throw new Error("Release identity mismatch: versionCode");
          for (const price of ["55,000 جنيه سوداني", "550,000 جنيه سوداني", "1,050,000 جنيه سوداني"]) {
            if (!app.includes(price)) throw new Error(`App is missing approved price: ${price}`);
          }
          for (const [plan, amount] of Object.entries({monthly:55000, annual:550000, lifetime:1050000})) {
            if (!worker.includes(`${plan}: { amount: ${amount}`)) throw new Error(`Licensing service amount mismatch for ${plan}`);
          }
          console.log("Release identity and all three approved bakery prices verified.");
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Validate factory module schema and requested screens
        run: |
          grep -Fq 'DB(Context c){super(c,"almizan_factory_1.db",SecureDatabase.passphrase(c,"almizan_factory_1.db"),null,6,0,null,null,false);}' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'CREATE TABLE daily_usage' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'دقيق' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'مواد تغليف' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'باسطة' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'بلح شام' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'FactoryMath.saleTotal(q,p)' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'daily_usage' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java
          grep -Fq 'FactoryLedgerActivity' bakery-app/app/src/main/AndroidManifest.xml
          grep -Fq 'private void returns()' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'private void wip()' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'work_order_stages' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'incrementalWipMaterialCost' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryMath.java
          grep -Fq 'financialReports()' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'work_order_stages' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java
          grep -Fq 'private void journals()' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'CREATE TABLE IF NOT EXISTS sales_returns' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'CREATE TABLE IF NOT EXISTS work_orders' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'CREATE TABLE IF NOT EXISTS journal_entries' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'root.put("schema_version", 6)' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java
          grep -Fq 'net.zetetic:sqlcipher-android:4.19.1@aar' bakery-app/app/build.gradle
          grep -Fq 'System.loadLibrary("sqlcipher")' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/SecureDatabase.java
          grep -Fq 'AndroidKeyStore' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/SecureDatabase.java
          grep -Fq 'migratePlaintext' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/SecureDatabase.java
          grep -Fq 'SecureDatabase.passphrase(MainActivity.this,"almizan_bakery_250.db")' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq 'SecureDatabase.passphrase(c,"almizan_factory_1.db")' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryActivity.java
          grep -Fq 'SecureDatabase.open(this,"almizan_factory_1.db")' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryLedgerActivity.java
          grep -Fq 'migratesLegacyBakeryDatabaseAndHidesPlaintext' bakery-app/app/src/androidTest/java/com/mohammedmustafa/almizan/bakery/SecureDatabaseMigrationTest.java
          grep -Fq '7L * 24L * 60L * 60L * 1000L' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq '27. التجربة المجانية والاشتراك' bakery-app/app/src/main/assets/bakery-guide.html
          grep -Fq '28. حالة حماية قاعدة البيانات' bakery-app/app/src/main/assets/bakery-guide.html
          grep -Fq 'minSdk 23' bakery-app/app/build.gradle
          grep -Fq 'targetSdk 35' bakery-app/app/build.gradle
          if grep -R -E 'Math\.(addExact|subtractExact|multiplyExact)\(' bakery-app/app/src/main/java; then
            echo "Checked arithmetic must remain compatible with Android API 23."
            exit 1
          fi
          grep -Fq 'root.optInt("schema_version")<6 && "work_order_stages".equals(TABLES[i])' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java
          echo "Factory modules, schema v6 backup compatibility and Android API 23 declarations verified."

      - name: Run arithmetic unit tests
        working-directory: bakery-app
        run: gradle testDebugUnitTest

      - name: Build debug and release APK
        working-directory: bakery-app
        run: gradle clean assembleDebug assembleRelease

      - name: Upload internal debug build (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.8.0-debug-internal
          path: bakery-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign and verify review APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: bakery-app
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing signing password secret"; exit 1; }
          ENCRYPTED_KEY="../.github/signing/smartcompany-release.jks.gpg"
          test -s "$ENCRYPTED_KEY" || { echo "::error::Encrypted long-term signing keystore is missing"; exit 1; }
          mkdir -p release signing
          printf '%s' "$KEYSTORE_PASSWORD" | gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$ENCRYPTED_KEY" > signing/release.jks
          test -s signing/release.jks
          keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
          aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
          count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          test "$count" = "1" || { echo "::error::Expected exactly one private-key entry in the keystore"; exit 1; }
          alias="$(printf '%s\n' "$aliases" | sed -n '1p')"
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -f -v 4 "$apk" release/AlMizan-Bakery-2.8.0-aligned.apk
          "$build_tools/apksigner" sign --ks signing/release.jks --ks-key-alias "$alias" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --out release/AlMizan-Bakery-2.8.0-review.apk release/AlMizan-Bakery-2.8.0-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs release/AlMizan-Bakery-2.8.0-review.apk | tee release/SIGNING-CERTIFICATE.txt
          cert_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' release/SIGNING-CERTIFICATE.txt | tr -d ':[:space:]')"
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          test "$cert_sha" = "$expected" || { echo "::error::Signing certificate fingerprint mismatch; do not distribute this APK"; exit 1; }
          badging="$("$build_tools/aapt" dump badging release/AlMizan-Bakery-2.8.0-review.apk)"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.almizan.bakery' versionCode='280000' versionName='2.8.0'"
          echo "$badging" | grep -F "application-label:'المحاسب الميزان للمخابز'"
          sha256sum release/AlMizan-Bakery-2.8.0-review.apk > release/SHA256SUMS.txt
          rm -f release/AlMizan-Bakery-2.8.0-aligned.apk signing/release.jks

      - name: Smoke test signed APK on minimum Android API 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            (cd bakery-app && gradle connectedDebugAndroidTest)
            adb uninstall com.mohammedmustafa.almizan.bakery || true
            adb install -r bakery-app/release/AlMizan-Bakery-2.8.0-review.apk
            adb logcat -c
            adb shell monkey -p com.mohammedmustafa.almizan.bakery 1
            sleep 8
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.mohammedmustafa.almizan.bakery'; then echo "Application crash detected"; exit 1; fi
            adb shell dumpsys package com.mohammedmustafa.almizan.bakery | grep -F "versionName=2.8.0"

      - name: Smoke test signed APK on modern Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r bakery-app/release/AlMizan-Bakery-2.8.0-review.apk
            adb logcat -c
            adb shell monkey -p com.mohammedmustafa.almizan.bakery 1
            sleep 8
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.mohammedmustafa.almizan.bakery'; then echo "Application crash detected"; exit 1; fi
            adb shell dumpsys package com.mohammedmustafa.almizan.bakery | grep -F "versionName=2.8.0"

      - name: Upload signed review APK and verification records
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-bakery-2.8.0-signed-review
          path: |
            bakery-app/release/AlMizan-Bakery-2.8.0-review.apk
            bakery-app/release/SHA256SUMS.txt
            bakery-app/release/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish approved commercial GitHub Release
        if: github.ref == 'refs/heads/release/bakery-2.8.0-financial-integrity'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: al-mizan-bakery-2.8.0
          name: المحاسب الميزان للمخابز والمصنع 2.8.0 — إصدار تجاري معتمد
          prerelease: false
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          body: |
            الإصدار التجاري المعتمد 2.8.0 من المحاسب الميزان للمخابز والمصنع.
            اعتمد مالك المنتج هذا الإصدار بعد اختباره على جهاز فعلي، وإتمام التحديث فوق النسخة السابقة، وإجراء عمليات تشغيل يومية للمخبز والمصنع ومراجعة النتائج.
            - معرّف الحزمة: com.mohammedmustafa.almizan.bakery
            - versionCode: 280000
            - Android minimum API: 23
            - يحافظ التحديث على معرّف الحزمة وقاعدة بيانات المخبز؛ لا تحذف الإصدار السابق عند التحديث.
            - يحتوي على حسابات المخبز اليومية ووحدة المصنع ودفاتر المواد والإنتاج والمبيعات والمردودات والتشغيل تحت التنفيذ والقيود وسجل التدقيق.
            - الأسعار المعتمدة: الشهري 55,000 جنيه سوداني؛ السنوي 550,000 جنيه سوداني؛ الدائم 1,050,000 جنيه سوداني.
            - الاشتراكات الشهرية والسنوية محددة المدة. الترخيص الدائم لا يصدر إلا بعد مراجعة الدفع وموافقة الإدارة.
            - احتفظ بنسخة احتياطية دورية. ملف النسخة الاحتياطية الحالي غير مشفر؛ احفظه في مكان آمن.
            - تم اختبار الإصدار من مالك المنتج على جهاز فعلي. لا يعني ذلك ضمان التوافق مع كل طراز هاتف؛ راجع متطلبات Android قبل التثبيت.
          files: |
            bakery-app/release/AlMizan-Bakery-2.8.0-review.apk
            bakery-app/release/SHA256SUMS.txt
            bakery-app/release/SIGNING-CERTIFICATE.txt

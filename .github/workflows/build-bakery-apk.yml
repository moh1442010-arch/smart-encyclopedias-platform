          grep -Fq 'PartyDirectoryBackup.export' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq 'PartyDirectoryBackup.restore' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java
          grep -Fq 'exchangeRatesSection' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/PartyDirectoryActivity.java
          grep -Fq 'exchange_rates' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/PartyDirectoryBackup.java
          grep -Fq 'supplier_payment_records' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/FactoryBackup.java

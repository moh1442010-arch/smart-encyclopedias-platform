name: Deploy delivery Worker

on:
  push:
    branches:
      - main
    paths:
      - "delivery/worker.js"
      - "delivery/wrangler.jsonc"
      - ".github/workflows/deploy-delivery-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b2f59f3997ad2918941d4d261370d1b4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Workers
        working-directory: delivery
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

# Trigger deployment after repository secret setup.
# Retrigger latest worker source after chunked-upload fix.

name: Deploy delivery Worker

on:
  push:
    branches:
      - main
    paths:
      - "delivery/worker.js"
      - "delivery/wrangler.jsonc"
      - ".github/workflows/deploy-delivery-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        working-directory: delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2f59f3997ad2918941d4d261370d1b4
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

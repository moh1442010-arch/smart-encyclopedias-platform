name: Deploy delivery Worker

on:
  push:
    branches:
      - main
    paths:
      - "delivery/worker.js"
      - "delivery/wrangler.jsonc"
      - ".github/workflows/deploy-delivery-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b2f59f3997ad2918941d4d261370d1b4
          workingDirectory: delivery

name: Verify Al-Mizan Bakery Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Validate private key and match app public key
        shell: bash
        env:
          PRIVATE_KEY_INPUT: ${{ secrets.BAKERY_LICENSE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/bakery-signing-private.pem"
          trap 'rm -f "$KEY_FILE"' EXIT

          test -n "${PRIVATE_KEY_INPUT:-}" || { echo "::error::BAKERY_LICENSE_PRIVATE_KEY_B64 is missing."; exit 1; }

          # Decode strictly. Do not silently strip non-Base64 characters (such as Arabic text).
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          raw = os.environ["PRIVATE_KEY_INPUT"]
          # Accept either a multiline PEM value or a Base64-encoded PEM.
          if raw.lstrip().startswith("-----BEGIN "):
              try:
                  data = raw.strip().replace("\r\n", "\n").replace("\r", "\n").encode("ascii")
              except UnicodeEncodeError:
                  print("::error::PEM secret contains non-ASCII characters.")
                  sys.exit(1)
          else:
              compact = "".join(raw.split())
              if not compact or not re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", compact):
                  print("::error::Secret contains characters outside Base64. Store Base64 only.")
                  sys.exit(1)
              if len(compact) % 4 == 1:
                  print("::error::Secret has an invalid Base64 length.")
                  sys.exit(1)
              padded = compact + ("=" * ((-len(compact)) % 4))
              try:
                  data = base64.b64decode(padded, validate=True)
              except Exception:
                  print("::error::Secret is not valid Base64.")
                  sys.exit(1)

          if not data.startswith(b"-----BEGIN ") or b"PRIVATE KEY-----" not in data[:100]:
              print("::error::Decoded content is not a PEM private key.")
              sys.exit(1)

          with open(os.environ["RUNNER_TEMP"] + "/bakery-signing-private.pem", "wb") as f:
              f.write(data)
          PY

          openssl pkey -in "$KEY_FILE" -check -noout >/dev/null 2>&1 || {
            echo "::error::Secret decoded, but it is not a valid private key."; exit 1;
          }

          EXPECTED="$(grep -oE 'LICENSE_PUBLIC_KEY_B64 = "[^"]+"' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java | head -1 | cut -d '"' -f2)"
          test -n "$EXPECTED" || { echo "::error::App public key was not found."; exit 1; }

          ACTUAL="$(openssl pkey -in "$KEY_FILE" -pubout -outform DER 2>/dev/null | base64 -w0)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::Private key does not match the public key embedded in the bakery app."; exit 1;
          }

          echo "PASS: Base64/PEM decoding, private-key integrity, and embedded public-key match."

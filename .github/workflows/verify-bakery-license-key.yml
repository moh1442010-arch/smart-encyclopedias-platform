name: Verify Al-Mizan Bakery Signing Configuration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-bakery-license-key.yml"
      - "bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java"
      - "tools/bakery-license-issuer.mjs"
      - "licensing/worker/src/index.js"

permissions:
  contents: read

jobs:
  verify-public-key-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Verify public key consistency without exposing private keys
        shell: bash
        run: |
          set -euo pipefail
          APP_KEY="$(grep -oE 'LICENSE_PUBLIC_KEY_B64 = "[^"]+"' bakery-app/app/src/main/java/com/mohammedmustafa/almizan/bakery/MainActivity.java | head -1 | cut -d '"' -f2)"
          ISSUER_KEY="$(grep -oE 'EXPECTED_PUBLIC_KEY_DER_B64 = "[^"]+"' tools/bakery-license-issuer.mjs | head -1 | cut -d '"' -f2)"
          WORKER_KEY="$(grep -oE 'EXPECTED_APP_PUBLIC_KEY_DER_B64 = "[^"]+"' licensing/worker/src/index.js | head -1 | cut -d '"' -f2)"
          test -n "$APP_KEY" || { echo "::error::App public key missing."; exit 1; }
          test -n "$ISSUER_KEY" || { echo "::error::Offline issuer public key missing."; exit 1; }
          test -n "$WORKER_KEY" || { echo "::error::Worker public key missing."; exit 1; }
          test "$APP_KEY" = "$ISSUER_KEY" || { echo "::error::App and offline issuer public keys differ."; exit 1; }
          test "$APP_KEY" = "$WORKER_KEY" || { echo "::error::App and Worker public keys differ."; exit 1; }
          echo "PASS: App, offline issuer, and Cloudflare Worker public keys are identical."
          echo "Private keys are intentionally not stored in GitHub Actions."

      - name: Verify live Cloudflare signing pair without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error https://al-mizan-bakery-licensing.moh1442010.workers.dev/diagnostics/signing-pair)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.signingReady !== true || x.signingPairMatches !== true) { console.error("::error::Cloudflare Worker signing is not ready: " + (x.error || "UNKNOWN") + ". No token was issued."); process.exit(1); }'
          <<< "$response"
          echo "PASS: Cloudflare signed and verified a test message against the app public key. No customer license was issued."

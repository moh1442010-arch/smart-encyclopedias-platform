name: Deploy bakery licensing Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "licensing/worker/**"
      - ".github/workflows/deploy-bakery-licensing.yml"

permissions:
  contents: read

concurrency:
  group: deploy-bakery-licensing
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy al-mizan-bakery-licensing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Worker JavaScript syntax
        run: node --check licensing/worker/src/index.js

      - name: Check deployment credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy only the bakery licensing Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b2f59f3997ad2918941d4d261370d1b4
          workingDirectory: licensing/worker
          command: deploy --config wrangler.toml

      - name: Publish validated signing key to the Cloudflare Worker
        working-directory: licensing/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRIVATE_KEY_B64: ${{ secrets.BAKERY_LICENSE_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const raw = String(process.env.PRIVATE_KEY_B64 || "").trim();
          const value = raw.replace(/\\s+/g, "");
          if (!value || !/^[A-Za-z0-9+/]+={0,2}$/.test(value) || value.length % 4 !== 0) {
            console.error("::error::GitHub secret BAKERY_LICENSE_PRIVATE_KEY_B64 is missing or is not strict Base64.");
            process.exit(1);
          }
          const der = Buffer.from(value, "base64");
          if (der.toString("base64") !== value) {
            console.error("::error::Signing key Base64 failed canonical validation.");
            process.exit(1);
          }
          try {
            crypto.createPrivateKey({ key: der, format: "der", type: "pkcs8" });
          } catch {
            console.error("::error::Signing key is not a valid PKCS#8 DER private key.");
            process.exit(1);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "mizan-private-key.b64"), value, { mode: 0o600 });
          console.log("PASS: GitHub signing secret is strict Base64 containing a valid PKCS#8 key.");
          NODE
          cat "$RUNNER_TEMP/mizan-private-key.b64" | npx --yes wrangler@4 secret put LICENSE_PRIVATE_KEY_PKCS8_B64 --config wrangler.toml
          rm -f "$RUNNER_TEMP/mizan-private-key.b64"

      - name: Check public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 20 https://al-mizan-bakery-licensing.moh1442010.workers.dev/health)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.ok !== true || x.service !== "al-mizan-bakery-licensing" || x.mode !== "manual-payment-review") { console.error("::error::Worker health response is invalid."); process.exit(1); }' "$response"

      - name: Verify Production admin login secrets
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 20 https://al-mizan-bakery-licensing.moh1442010.workers.dev/diagnostics/admin-config)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.adminPasswordConfigured !== true) { console.error("::error::Set ADMIN_PASSWORD (32+ random characters) as a Worker secret before deployment."); process.exit(1); }' "$response"

      - name: Verify Production signing key configuration
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 20 https://al-mizan-bakery-licensing.moh1442010.workers.dev/diagnostics/signing-config)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.privateKeyConfigured !== true || x.publicKeyConfigured !== true || x.publicKeyMatchesApp !== true || !["pkcs8","pkcs1-convertible"].includes(x.privateKeyFormat)) { console.error("::error::Production signing configuration is invalid. Require a supported private-key encoding and the app-matching public key. Update Worker secrets LICENSE_PRIVATE_KEY_PKCS8_B64 and LICENSE_PUBLIC_KEY_DER_B64, then redeploy."); process.exit(1); }' "$response"

      - name: Verify live signing pair with a real signature
        run: |
          response="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 20 https://al-mizan-bakery-licensing.moh1442010.workers.dev/diagnostics/signing-pair)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.signingReady !== true || x.signingPairMatches !== true) { console.error("::error::Live signing-pair test failed: " + (x.error || "UNKNOWN")); process.exit(1); }' "$response"

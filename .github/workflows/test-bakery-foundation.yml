name: Al-Mizan foundation tests (no APK)

on:
  push:
    branches:
      - "feature/**"
      - "integration/**"
    paths:
      - "bakery-app/app/src/**"
      - "bakery-app/app/build.gradle"
      - "bakery-app/build.gradle"
      - "bakery-app/settings.gradle"
      - ".github/workflows/test-bakery-foundation.yml"
  pull_request:
    paths:
      - "bakery-app/app/src/**"
      - "bakery-app/app/build.gradle"
      - "bakery-app/build.gradle"
      - "bakery-app/settings.gradle"
      - ".github/workflows/test-bakery-foundation.yml"

permissions:
  contents: read

concurrency:
  # Cancel stale commits on the same ref so the latest source receives the emulator capacity.
  group: al-mizan-foundation-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Enforce Android API 23 checked arithmetic compatibility
        run: |
          if grep -R -E 'Math\\.(addExact|subtractExact|multiplyExact)\\(' bakery-app/app/src/main/java; then
            echo "Use API 23 compatible checked arithmetic helpers."
            exit 1
          fi
      - name: Run bakery and factory unit tests only (no APK tasks)
        working-directory: bakery-app
        run: gradle testDebugUnitTest compileDebugAndroidTestJavaWithJavac --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-foundation-unit-test-reports
          path: bakery-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
  android-instrumented-tests:
    name: Android instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # Both supported API levels are gating. Emulator infrastructure failures remain visible.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [28, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Verify pinned Gradle version
        run: |
          gradle --version
          gradle --version | grep -F "Gradle 8.9"
      - name: Run SQLCipher and database instrumented tests on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          # Reserve memory for Android system services; keep Gradle heap bounded to reduce emulator OOM kills.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -memory 4096 -cores 2 -partition-size 2048 -gpu swiftshader_indirect -camera-back none -no-metrics -no-snapshot-load -wipe-data
          # Avoid the action's pre-script adb animation call; apply best-effort settings in script.
          disable-animations: false
          emulator-boot-timeout: 900
          working-directory: bakery-app
          # The emulator action executes script as one sh -c command; keep shell control flow on one line.
          # The emulator action passes script through sh -c; keep the entire script on one line.
          script: adb wait-for-device && boot_state='' && for attempt in $(seq 1 180); do boot_state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"; [ "$boot_state" = "1" ] && break; sleep 5; done && test "$boot_state" = "1" && for attempt in $(seq 1 24); do adb shell pm list packages >/dev/null 2>&1 && break; sleep 5; done && adb shell pm list packages >/dev/null && mkdir -p app/build/diagnostics && trap 'adb logcat -d -t 8000 > app/build/diagnostics/logcat.txt 2>&1 || true; adb shell dumpsys meminfo > app/build/diagnostics/meminfo.txt 2>&1 || true; adb shell df -h > app/build/diagnostics/storage.txt 2>&1 || true' EXIT && (adb shell settings put global package_verifier_enable 0 || true) && (adb shell settings put global verifier_verify_adb_installs 0 || true) && (adb shell settings put global window_animation_scale 0 || true) && (adb shell settings put global transition_animation_scale 0 || true) && (adb shell settings put global animator_duration_scale 0 || true) && gradle --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1024m connectedDebugAndroidTest --stacktrace
      - name: Record API 28 emulator validation status
        if: always() && matrix.api-level == 28
        run: |
          echo "API 28 instrumented tests are a required gating check. A green unit-test job does not replace API 28 device validation." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-instrumented-api-${{ matrix.api-level }}-reports
          path: bakery-app/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14


name: Al-Mizan foundation tests (no APK)

on:
  push:
    branches:
      - "feature/**"
      - "integration/**"
    paths:
      - "bakery-app/app/src/**"
      - "bakery-app/app/build.gradle"
      - "bakery-app/build.gradle"
      - "bakery-app/settings.gradle"
      - ".github/workflows/test-bakery-foundation.yml"
  pull_request:
    paths:
      - "bakery-app/app/src/**"
      - "bakery-app/app/build.gradle"
      - "bakery-app/build.gradle"
      - "bakery-app/settings.gradle"
      - ".github/workflows/test-bakery-foundation.yml"

permissions:
  contents: read

concurrency:
  group: al-mizan-foundation-tests-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Enforce Android API 23 checked arithmetic compatibility
        run: |
          if grep -R -E 'Math\\.(addExact|subtractExact|multiplyExact)\\(' bakery-app/app/src/main/java; then
            echo "Use API 23 compatible checked arithmetic helpers."
            exit 1
          fi
      - name: Run bakery and factory unit tests only (no APK tasks)
        working-directory: bakery-app
        run: gradle testDebugUnitTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-foundation-unit-test-reports
          path: bakery-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
  android-instrumented-tests:
    name: Android instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run SQLCipher and database instrumented tests on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: bakery-app
          script: gradle connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-instrumented-api-${{ matrix.api-level }}-reports
          path: bakery-app/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14


name: Build Smart Company Signed Android Release 2.3.1 - Signing Validation

concurrency:
  group: smart-company-android-release
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9

      - name: Automated database integrity tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest

      - name: Build release only
        working-directory: android-app
        run: ./gradlew clean assembleRelease bundleRelease

      # A fresh-install test APK is signed with Android's automatically generated debug key.
      # It is for device testing only, never for commercial distribution.
      - name: Build clean-install test APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload clean-install test APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-company-2.3.1-clean-install-test-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Sign release APK and App Bundle
        env:
          KEYSTORE_B64: ${{ secrets.SMARTCOMPANY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTCOMPANY_KEY_ALIAS || 'smartcompany-release' }}
          KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEY_PASSWORD || secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: android-app
        run: |
          set -euo pipefail
          missing=()
          test -n "$KEYSTORE_B64" || missing+=("SMARTCOMPANY_KEYSTORE_BASE64")
          test -n "$KEYSTORE_PASSWORD" || missing+=("SMARTCOMPANY_KEYSTORE_PASSWORD")
          test -n "$KEY_ALIAS" || missing+=("SMARTCOMPANY_KEY_ALIAS")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Production signing not configured::Add these repository Actions secrets before creating a signed release: ${missing[*]}"
            echo "No production-signed APK/AAB was created. Do not use an unsigned artifact as a commercial release."
            exit 1
          fi
          mkdir -p signing release
          # Normalize common phone clipboard artifacts without exposing the secret.
          # Accept standard or URL-safe Base64; strip whitespace and surrounding quotes.
          KEYSTORE_B64_CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | sed "s/^[\"']//; s/[\"']$//" | tr '_-' '/+')"
          # Remove accidental non-Base64 clipboard characters. keytool validates the decoded key below.
          KEYSTORE_B64_CLEAN="$(printf '%s' "$KEYSTORE_B64_CLEAN" | tr -cd 'A-Za-z0-9+/=')"
          if [ -z "$KEYSTORE_B64_CLEAN" ]; then
            echo "::error title=Empty keystore Base64::The signing secret is empty after normalization; GitHub did not provide a usable value to this workflow."
            exit 1
          fi
          # Restore omitted padding only when Base64 length makes that unambiguous.
          case $((${#KEYSTORE_B64_CLEAN} % 4)) in
            2) KEYSTORE_B64_CLEAN="${KEYSTORE_B64_CLEAN}==" ;;
            3) KEYSTORE_B64_CLEAN="${KEYSTORE_B64_CLEAN}=" ;;
            1) echo "::error title=Invalid Base64 length::The signing secret appears truncated or corrupted; keystore validation was not attempted."; exit 1 ;;
          esac
          if ! printf '%s' "$KEYSTORE_B64_CLEAN" | base64 --decode > signing/release.jks 2>/dev/null || ! test -s signing/release.jks; then
            echo "::error title=Keystore decode failed::The signing secret is still not valid Base64. No secret contents were logged."
            exit 1
          fi
          # Safe diagnostic: compare this hash with the local keystore file hash.
          # This does not print or expose the keystore contents or any password.
          echo "Decoded keystore SHA-256 fingerprint:"
          sha256sum signing/release.jks | awk '{print $1}'
          # Validate the store password separately so the failure is actionable.
          echo "b64 chars: ${#KEYSTORE_B64_CLEAN} raw: ${#KEYSTORE_B64}"
          echo "decoded bytes: $(wc -c < signing/release.jks)"
          echo "store pass length: ${#KEYSTORE_PASSWORD}"
          if ! kt_out="$(keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>&1)"; then
            echo "keytool: $(printf '%s' "$kt_out" | head -n 2)"
            if printf '%s' "$kt_out" | grep -Eqi 'Unrecognized keystore format|Invalid keystore format|Keystore was tampered with, or password was incorrect'; then
              if printf '%s' "$kt_out" | grep -Eqi 'Unrecognized keystore format|Invalid keystore format'; then
                echo "::error title=Invalid keystore file::Base64 decoded, but the resulting file is not a recognized Java keystore. Recreate SMARTCOMPANY_KEYSTORE_BASE64 from the original valid keystore file; do not change passwords yet."
              else
                echo "::error title=Keystore password rejected::The keystore format was recognized, but the store password may be incorrect. Verify SMARTCOMPANY_KEYSTORE_PASSWORD locally without sharing it."
              fi
            else
              echo "::error title=Keystore validation failed::keytool could not validate the keystore. Review the keytool error above; no password or keystore contents were printed."
            fi
            exit 1
          fi
          # If the configured alias is wrong, auto-correct only when the keystore contains
          # exactly one private-key entry. Alias names are safe to report; passwords never are.
          if ! keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
            count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ]; then
              KEY_ALIAS="$(printf '%s\n' "$aliases" | sed -n '1p')"
              echo "Configured alias did not match; safely selected the only private-key alias in the keystore."
            else
              echo "::error title=Keystore alias mismatch::The store password is correct, but SMARTCOMPANY_KEY_ALIAS did not match a key. The keystore contains $count private-key entries; no alias was guessed."
              exit 1
            fi
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks signing/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out release/SmartCompany-2.3.1-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab release/SmartCompany-2.3.1-release.aab
          jarsigner -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" release/SmartCompany-2.3.1-release.aab "$KEY_ALIAS"
          "$apksigner" verify --verbose release/SmartCompany-2.3.1-release.apk
          jarsigner -verify -verbose release/SmartCompany-2.3.1-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 release/SmartCompany-2.3.1-release.apk
          sha256sum release/SmartCompany-2.3.1-release.apk release/SmartCompany-2.3.1-release.aab > release/SHA256SUMS.txt

      - name: Final release QA
        working-directory: android-app
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="release/SmartCompany-2.3.1-release.apk"
          aab="release/SmartCompany-2.3.1-release.aab"
          test -s "$apk"
          test -s "$aab"
          test -s "release/SHA256SUMS.txt"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.smartcompany' versionCode='33' versionName='2.3.1'"
          echo "$badging" | grep -F "application-label:'شركة محمد مصطفى الذكية'"
          permissions="$("$build_tools/aapt" dump permissions "$apk")"
          if echo "$permissions" | grep -q "android.permission.INTERNET"; then echo "Unexpected INTERNET permission"; exit 1; fi
          "$build_tools/apksigner" verify --verbose "$apk"
          jarsigner -verify -verbose "$aab"
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Upload signed release artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: smart-company-android-signed-release-v2.3.1
          path: |
            android-app/release/SmartCompany-2.3.1-release.apk
            android-app/release/SmartCompany-2.3.1-release.aab
            android-app/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

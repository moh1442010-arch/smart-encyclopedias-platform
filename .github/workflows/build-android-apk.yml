name: Build Smart Company Signed Android Release 2.2.4

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build release only
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew clean assembleRelease bundleRelease

      - name: Sign release APK and App Bundle
        env:
          KEYSTORE_B64: ${{ secrets.SMARTCOMPANY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTCOMPANY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEY_PASSWORD }}
        working-directory: android-app
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || (echo "Missing production signing secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing keystore password secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing key alias secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing key password secret" && exit 1)
          mkdir -p signing release
          echo "$KEYSTORE_B64" | base64 --decode > signing/release.jks
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks signing/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out release/SmartCompany-2.2.4-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab release/SmartCompany-2.2.4-release.aab
          jarsigner -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" release/SmartCompany-2.2.4-release.aab "$KEY_ALIAS"
          "$apksigner" verify --verbose release/SmartCompany-2.2.4-release.apk
          jarsigner -verify -verbose release/SmartCompany-2.2.4-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 release/SmartCompany-2.2.4-release.apk
          sha256sum release/SmartCompany-2.2.4-release.apk release/SmartCompany-2.2.4-release.aab > release/SHA256SUMS.txt

      - name: Final release QA
        working-directory: android-app
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="release/SmartCompany-2.2.4-release.apk"
          aab="release/SmartCompany-2.2.4-release.aab"
          test -s "$apk"
          test -s "$aab"
          test -s "release/SHA256SUMS.txt"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.smartcompany' versionCode='26' versionName='2.2.4'"
          echo "$badging" | grep -F "application-label:'شركة محمد مصطفى الذكية'"
          permissions="$("$build_tools/aapt" dump permissions "$apk")"
          if echo "$permissions" | grep -q "android.permission.INTERNET"; then echo "Unexpected INTERNET permission"; exit 1; fi
          "$build_tools/apksigner" verify --verbose "$apk"
          jarsigner -verify -verbose "$aab"
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Upload signed release artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: smart-company-android-signed-release-v2.2.4
          path: |
            android-app/release/SmartCompany-2.2.4-release.apk
            android-app/release/SmartCompany-2.2.4-release.aab
            android-app/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

name: Build Al-Mizan Accountant Android Release 2.4.0 - Signed

concurrency:
  group: smart-company-android-release
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9

      - name: Automated database integrity tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest

      - name: Build release only
        working-directory: android-app
        run: ./gradlew clean assembleRelease bundleRelease

      # A fresh-install test APK is signed with Android's automatically generated debug key.
      # It is for device testing only, never for commercial distribution.
      - name: Build clean-install test APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload clean-install test APK
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-2.4.0-clean-install-test-debug
          path: android-app/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Sign release APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: smartcompany-release
          KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: android-app
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing password missing::Add SMARTCOMPANY_KEYSTORE_PASSWORD as a repository Actions secret. No signed release was created."
            exit 1
          fi
          ENCRYPTED_KEY="../.github/signing/smartcompany-release.jks.gpg"
          if [ ! -s "$ENCRYPTED_KEY" ]; then
            echo "::error title=Encrypted signing key missing::Run Initialize Smart Company Release Signing Key once first. It must save .github/signing/smartcompany-release.jks.gpg before building a signed release."
            exit 1
          fi
          mkdir -p signing release
          # Decrypt directly from the repository's AES-256-encrypted key file.
          # The password is passed via stdin and is never printed.
          if ! printf '%s' "$KEYSTORE_PASSWORD" | gpg --quiet --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt "$ENCRYPTED_KEY" > signing/release.jks; then
            rm -f signing/release.jks
            echo "::error title=Signing key decryption failed::The password did not unlock the saved encrypted key, or the encrypted file is invalid. No secret values were printed."
            exit 1
          fi
          if [ ! -s signing/release.jks ]; then
            echo "::error title=Empty signing key::The decrypted keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error title=Keystore validation failed::The encrypted file decrypted, but the password or keystore format did not validate. No secret values were printed."
            exit 1
          fi
          if ! keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
            count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ]; then
              KEY_ALIAS="$(printf '%s\n' "$aliases" | sed -n '1p')"
              echo "Configured alias did not match; selected the only private-key alias in the keystore."
            else
              echo "::error title=Keystore alias mismatch::SMARTCOMPANY_KEY_ALIAS did not match a key and the keystore contains $count private-key entries."
              exit 1
            fi
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          for edition in basic pro business enterprise; do
            case "$edition" in
              basic) title="Basic"; expected_package="com.mohammedmustafa.smartcompany.basic" ;;
              pro) title="Pro"; expected_package="com.mohammedmustafa.smartcompany.pro" ;;
              business) title="Business"; expected_package="com.mohammedmustafa.smartcompany.business" ;;
              enterprise) title="Enterprise"; expected_package="com.mohammedmustafa.smartcompany" ;;
            esac
            apk_in="app/build/outputs/apk/$edition/release/app-$edition-release-unsigned.apk"
            aab_in="app/build/outputs/bundle/${edition}Release/app-$edition-release.aab"
            apk_out="release/AlMizan-$title-2.4.0-release.apk"
            aab_out="release/AlMizan-$title-2.4.0-release.aab"
            test -s "$apk_in"
            test -s "$aab_in"
            "$apksigner" sign --ks signing/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$apk_out" "$apk_in"
            cp "$aab_in" "$aab_out"
            jarsigner -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$aab_out" "$KEY_ALIAS"
            "$apksigner" verify --verbose "$apk_out"
            jarsigner -verify -verbose "$aab_out"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk_out"
            "$apksigner" verify --print-certs "$apk_out" > "release/SIGNING-CERTIFICATE-$title.txt"
            cert_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "release/SIGNING-CERTIFICATE-$title.txt" | tr -d ':[:space:]')"
            if [ "$cert_sha" != "$expected" ]; then
              echo "::error title=Signing certificate mismatch::$title did not use the expected long-term signing certificate."
              exit 1
            fi
            echo "$cert_sha" > "release/SIGNING-CERT-SHA256-$title.txt"
            badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_out")"
            echo "$badging" | grep -F "package: name='$expected_package' versionCode='41' versionName='2.4.0'"
            echo "$badging" | grep -F "application-label:'المحاسب الميزان"
            permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk_out")"
            echo "$permissions" | grep -q "android.permission.INTERNET"
          done
          sha256sum release/AlMizan-*-2.4.0-release.apk release/AlMizan-*-2.4.0-release.aab > release/SHA256SUMS.txt

      - name: Upload signed release artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: al-mizan-android-edition-candidates-v2.4.0
          path: |
            android-app/release/AlMizan-*-2.4.0-release.apk
            android-app/release/AlMizan-*-2.4.0-release.aab
            android-app/release/SHA256SUMS.txt
            android-app/release/SIGNING-CERTIFICATE-*.txt
            android-app/release/SIGNING-CERT-SHA256-*.txt
          if-no-files-found: error
          retention-days: 90

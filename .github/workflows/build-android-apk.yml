name: Build Smart Company Accounting App 2.0

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug and release
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew clean assembleDebug assembleRelease bundleRelease

      - name: Sign release when production key exists
        env:
          KEYSTORE_B64: ${{ secrets.SMARTCOMPANY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTCOMPANY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEY_PASSWORD }}
        working-directory: android-app
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > signing/release.jks
            apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
            "$apksigner" sign --ks signing/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out smart-company-v2.0.0-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
            "$apksigner" verify --verbose smart-company-v2.0.0-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk smart-company-v2.0.0-unsigned.apk
          fi
          cp app/build/outputs/apk/debug/app-debug.apk smart-company-v2.0.0-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab smart-company-v2.0.0.aab
          sha256sum smart-company-v2.0.0-*.apk smart-company-v2.0.0.aab > smart-company-v2.0.0.sha256

      - name: Upload 2.0 package
        uses: actions/upload-artifact@v4
        with:
          name: smart-company-v2.0.0
          path: |
            android-app/smart-company-v2.0.0-*.apk
            android-app/smart-company-v2.0.0.aab
            android-app/smart-company-v2.0.0.sha256
          if-no-files-found: error
          retention-days: 90

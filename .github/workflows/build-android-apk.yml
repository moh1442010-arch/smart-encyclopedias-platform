name: Build Al-Mizan Accountant Android Release - Signed

concurrency:
  group: smart-company-android-release
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - "repair/al-mizan-money-precision-2.3.14"
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version from release tag and synchronize Android metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ "${REF_NAME}" =~ ([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            VERSION_NAME="$(sed -nE "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/p" android-app/app/build.gradle | head -n1)"
          fi
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::Use a release tag in the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          [[ "${VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error title=Version component too large::Minor and patch components must be below 1000."
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android-app/app/build.gradle
          sed -i -E "s/versionName ['\"][^'\"]+['\"]/versionName '${VERSION_NAME}'/" android-app/app/build.gradle
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
          } >> "${GITHUB_ENV}"
          echo "name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Android version: ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9

      - name: Automated database integrity tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest

      - name: Build release only
        working-directory: android-app
        run: ./gradlew clean assembleRelease bundleRelease

      # A fresh-install test APK is signed with Android's automatically generated debug key.
      # It is for device testing only, never for commercial distribution.
      - name: Build clean-install test APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload clean-install test APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: al-mizan-${{ env.VERSION_NAME }}-clean-install-test-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Sign release APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: smartcompany-release
          KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEYSTORE_PASSWORD }}
        working-directory: android-app
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing password missing::Add SMARTCOMPANY_KEYSTORE_PASSWORD as a repository Actions secret. No signed release was created."
            exit 1
          fi
          ENCRYPTED_KEY="../.github/signing/smartcompany-release.jks.gpg"
          if [ ! -s "$ENCRYPTED_KEY" ]; then
            echo "::error title=Encrypted signing key missing::Run Initialize Smart Company Release Signing Key once first. It must save .github/signing/smartcompany-release.jks.gpg before building a signed release."
            exit 1
          fi
          mkdir -p signing release
          # Decrypt directly from the repository's AES-256-encrypted key file.
          # The password is passed via stdin and is never printed.
          if ! printf '%s' "$KEYSTORE_PASSWORD" | gpg --quiet --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt "$ENCRYPTED_KEY" > signing/release.jks; then
            rm -f signing/release.jks
            echo "::error title=Signing key decryption failed::The password did not unlock the saved encrypted key, or the encrypted file is invalid. No secret values were printed."
            exit 1
          fi
          if [ ! -s signing/release.jks ]; then
            echo "::error title=Empty signing key::The decrypted keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error title=Keystore validation failed::The encrypted file decrypted, but the password or keystore format did not validate. No secret values were printed."
            exit 1
          fi
          if ! keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            aliases="$(keytool -list -v -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {a=$2} /^Entry type: PrivateKeyEntry/ {if (a != "") print a; a=""}')"
            count="$(printf '%s\n' "$aliases" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ]; then
              KEY_ALIAS="$(printf '%s\n' "$aliases" | sed -n '1p')"
              echo "Configured alias did not match; selected the only private-key alias in the keystore."
            else
              echo "::error title=Keystore alias mismatch::SMARTCOMPANY_KEY_ALIAS did not match a key and the keystore contains $count private-key entries."
              exit 1
            fi
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks signing/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out release/AlMizan-${VERSION_NAME}-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab release/AlMizan-${VERSION_NAME}-release.aab
          jarsigner -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" release/AlMizan-${VERSION_NAME}-release.aab "$KEY_ALIAS"
          "$apksigner" verify --verbose release/AlMizan-${VERSION_NAME}-release.apk
          jarsigner -verify -verbose release/AlMizan-${VERSION_NAME}-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 release/AlMizan-${VERSION_NAME}-release.apk
          # Record the release certificate fingerprint so installed-version update issues can be diagnosed.
          "$apksigner" verify --print-certs release/AlMizan-${VERSION_NAME}-release.apk > release/SIGNING-CERTIFICATE.txt
          cert_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' release/SIGNING-CERTIFICATE.txt | tr -d ':[:space:]')"
          if [ -z "$cert_sha" ]; then
            echo "::error title=Signing certificate fingerprint missing::Could not extract the signed APK certificate fingerprint."
            exit 1
          fi
          echo "$cert_sha" > release/SIGNING-CERT-SHA256.txt
          # Public certificate fingerprint verified from the 2.3.4 and 2.3.5 signed release artifacts.
          expected="159f40945e9afbba77bb58ffbbcc0c73bf247a6f4e630463b8c1fe5ec60b0279"
          if [ "$cert_sha" != "$expected" ]; then
            echo "::error title=Signing certificate changed::Expected the verified long-term release certificate. Android updates may fail if the signing key changed."
            exit 1
          fi
          sha256sum release/AlMizan-${VERSION_NAME}-release.apk release/AlMizan-${VERSION_NAME}-release.aab > release/SHA256SUMS.txt

      - name: Final release QA
        working-directory: android-app
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="release/AlMizan-${VERSION_NAME}-release.apk"
          aab="release/AlMizan-${VERSION_NAME}-release.aab"
          test -s "$apk"
          test -s "$aab"
          test -s "release/SHA256SUMS.txt"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='com.mohammedmustafa.smartcompany' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          echo "$badging" | grep -F "application-label:'المحاسب الميزان'"
          echo "$badging" | grep -F "targetSdkVersion:'36'"
          permissions="$("$build_tools/aapt" dump permissions "$apk")"
          echo "$permissions" | grep -q "android.permission.INTERNET" || { echo "Required INTERNET permission for server-side commercial licensing is missing"; exit 1; }
          "$build_tools/apksigner" verify --verbose "$apk"
          jarsigner -verify -verbose "$aab"
          sha256sum --check release/SHA256SUMS.txt

      - name: Upload signed release artifacts only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: al-mizan-android-signed-release-v${{ env.VERSION_NAME }}
          path: |
            android-app/release/AlMizan-${{ env.VERSION_NAME }}-release.apk
            android-app/release/AlMizan-${{ env.VERSION_NAME }}-release.aab
            android-app/release/SHA256SUMS.txt
            android-app/release/SIGNING-CERTIFICATE.txt
            android-app/release/SIGNING-CERT-SHA256.txt
          if-no-files-found: error
          retention-days: 90

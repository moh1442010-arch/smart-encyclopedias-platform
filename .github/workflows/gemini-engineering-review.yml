name: Gemini engineering review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gemini-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review pull request with Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test reviewer redaction and safety helpers
        run: python -m unittest .github/scripts/test_gemini_pr_review.py

      - name: Run read-only engineering review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python .github/scripts/gemini_pr_review.py

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: gemini-engineering-review-pr-${{ inputs.pr_number }}
          path: gemini-review-report.md
          if-no-files-found: error
          retention-days: 14

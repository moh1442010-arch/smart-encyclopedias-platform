plugins { id 'com.android.application' }

def hasTirbalReleaseSigning = ['TIRBAL_KEYSTORE_PATH','TIRBAL_KEYSTORE_PASSWORD','TIRBAL_KEY_ALIAS','TIRBAL_KEY_PASSWORD'].every { System.getenv(it)?.trim() }

android {
    signingConfigs {
        if (hasTirbalReleaseSigning) {
            release {
                storeFile file(System.getenv('TIRBAL_KEYSTORE_PATH'))
                storePassword System.getenv('TIRBAL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TIRBAL_KEY_ALIAS')
                keyPassword System.getenv('TIRBAL_KEY_PASSWORD')
            }
        }
    }

    namespace 'com.mohammedmustafa.tirbal'
    compileSdk 36 // Review build: simplified worker ledger and settlement 1.7.0

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.mohammedmustafa.tirbal'
        minSdk 23
        targetSdk 36
        versionCode 13
        versionName '1.8.2'
        // Commercial licensing is controlled by the website nucleus.
        buildConfigField 'boolean', 'REMOTE_LICENSE_CONTROL', 'true'
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'REVIEW_MODE', 'true'
        }
        release {
            buildConfigField 'boolean', 'REVIEW_MODE', 'false'
            if (hasTirbalReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'net.zetetic:sqlcipher-android:4.20.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    testImplementation 'junit:junit:4.13.2'
}

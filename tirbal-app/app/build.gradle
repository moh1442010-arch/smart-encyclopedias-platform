plugins { id 'com.android.application' }

android {
    namespace 'com.mohammedmustafa.tirbal'
    compileSdk 36 // Review build: double-entry ledger 1.5.0

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.mohammedmustafa.tirbal'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.5.0'
        // Licensing is remotely controlled by the website nucleus. Keep disabled during review.
        buildConfigField 'boolean', 'REMOTE_LICENSE_CONTROL', 'true'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'net.zetetic:sqlcipher-android:4.20.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
}

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="معاينة مجانية من 20 صفحة للموسوعة الشاملة في الذكاء الاصطناعي باللغة العربية."><title>معاينة الموسوعة — 20 صفحة</title><style>body{margin:0;background:#eef1f5;font-family:Arial,sans-serif;color:#172033}.bar{position:sticky;top:0;background:#fff;padding:10px 12px;box-shadow:0 2px 10px #0001;z-index:2}.barin{width:min(980px,94vw);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar a{color:#07182f;text-decoration:none;font-weight:800}.count{font-weight:800}.page{width:min(900px,94vw);min-height:760px;margin:20px auto;padding:44px;background:#fff;box-shadow:0 4px 22px #0002;line-height:1.9;font-size:18px;box-sizing:border-box;border-top:7px solid #c99a3a}.num{color:#64748b;font-size:.85rem;margin-bottom:28px}.title{font-size:clamp(1.5rem,4vw,2.6rem);color:#07182f;font-weight:900;line-height:1.35}.sub{font-size:1.15rem;color:#53657d;margin-top:12px}.rule{height:1px;background:#dce2e9;margin:28px 0}.body{font-size:1.05rem;white-space:pre-wrap}.nav{width:min(900px,94vw);margin:0 auto 30px;display:flex;justify-content:space-between;gap:10px}.nav button,.nav a{border:0;border-radius:10px;padding:11px 16px;background:#07182f;color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.dots{width:min(900px,94vw);margin:0 auto 30px;display:flex;gap:6px;flex-wrap:wrap}.dots button{width:34px;height:34px;border:1px solid #d6dde6;background:#fff;border-radius:8px;cursor:pointer}.dots button.active{background:#07182f;color:#fff}.cta{width:min(900px,94vw);margin:0 auto 40px;background:#07182f;color:#fff;border-radius:18px;padding:20px;box-sizing:border-box;text-align:center}.cta a{display:inline-block;margin-top:10px;background:#e0b85d;color:#142033;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:900}@media(max-width:600px){.page{padding:28px 22px;min-height:650px;font-size:16px}.barin{justify-content:center}.nav{flex-wrap:wrap}.nav button,.nav a{flex:1;text-align:center}}
</style></head><body><div class="bar"><div class="barin"><a href="index.html">← الرئيسية</a><span class="count">المعاينة المجانية — الصفحة <span id="n">1</span> من 20</span><a href="checkout.html">شراء النسخة الكاملة</a></div></div><main id="page" class="page"></main><div class="nav"><button id="prev">← السابقة</button><button id="next">التالية →</button></div><div id="dots" class="dots" aria-label="اختيار صفحة"></div><section class="cta"><strong>أعجبتك العينة؟</strong><div>النسخة الكاملة تتضمن المحتوى الموسع والوكيل الذكي المصاحب.</div><a href="checkout.html">الانتقال إلى الشراء</a></section><script>const pages=[['الموسوعة الشاملة في الذكاء الاصطناعي','من الصفر إلى الاحتراف','محمد مصطفى بابكر'],['دليل استخدام الموسوعة الشاملة للذكاء الاصطناعي','كيف تتعلم من الموسوعة وتنتقل من الأساسيات إلى التطبيق.',''],['خريطة رحلة تعلم الذكاء الاصطناعي','مسار متدرج يبدأ بالمفاهيم الأساسية وينتهي بالتطبيقات والوكلاء الأذكياء.',''],['مقدمة المشروع وأهدافه','بناء مرجع عربي منهجي يساعد القارئ على الفهم ثم التطبيق.',''],['لماذا هذه الموسوعة؟','الجمع بين الشرح المنهجي والمصطلحات العربية والمقابلات الإنجليزية والأمثلة التطبيقية.',''],['رحلة تطور الذكاء الاصطناعي عبر الزمن','من الأنظمة الرمزية إلى التعلم العميق والنماذج التوليدية الحديثة.',''],['أنواع الذكاء الاصطناعي: دليل تعليمي شامل','تصنيف المفاهيم والنظم الذكية مع أمثلة مبسطة.',''],['أساسيات الذكاء الاصطناعي','المفاهيم والمصطلحات التي يحتاجها المبتدئ قبل الانتقال إلى الخوارزميات.',''],['المفاهيم الأساسية والخرائط المعرفية','تنظيم المعرفة في خرائط تساعد على الربط بين المجالات.',''],['تعلم الآلة والخوارزميات','مقدمة في البيانات والميزات والنماذج والتدريب والتقييم.',''],['التعلم الخاضع للإشراف وغير الخاضع للإشراف','الفروق والاستخدامات وأمثلة عملية على التصنيف والتجميع.',''],['التعلم المعزز وتقييم النماذج','مفاهيم المكافأة والسياسة والتوازن بين الاستكشاف والاستغلال.',''],['الشبكات العصبية والتعلم العميق','من الخلية العصبية الاصطناعية إلى الشبكات العميقة.',''],['الشبكات العصبية المتكررة RNN','التعامل مع البيانات المتسلسلة ومفاهيم الذاكرة في النماذج.',''],['الذاكرة طويلة قصيرة المدى LSTM','معالجة مشكلة الذاكرة طويلة المدى في السلاسل الزمنية.',''],['المحولات وآلية الانتباه','الأساس المعماري الذي غيّر معالجة اللغة والوسائط.',''],['النماذج اللغوية الكبيرة LLMs','كيف تتعلم النماذج اللغوية من كميات ضخمة من البيانات.',''],['هندسة الأوامر Prompt Engineering','صياغة تعليمات دقيقة للحصول على مخرجات أكثر جودة واتساقًا.',''],['التوليد المعزز بالاسترجاع RAG','ربط النماذج اللغوية بمصادر معرفة خارجية لتقليل الهلوسة وتحسين الدقة.',''],['الوكيل الذكي وتطبيقاته','من النموذج إلى نظام قادر على التخطيط واستخدام الأدوات وتنفيذ المهام.','']];let n=Math.max(1,Math.min(20,parseInt(location.hash.slice(1))||1));const page=document.getElementById('page'),num=document.getElementById('n'),prev=document.getElementById('prev'),next=document.getElementById('next'),dots=document.getElementById('dots');pages.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>go(i+1);dots.appendChild(b)});function go(x){n=Math.max(1,Math.min(20,x));location.hash=n;render()}function render(){const p=pages[n-1];num.textContent=n;page.innerHTML='<div class="num">صفحة '+n+' من 20 • معاينة مجانية</div><div class="title">'+p[0]+'</div>'+(p[1]?'<div class="sub">'+p[1]+'</div>':'')+'<div class="rule"></div><div class="body">'+(n===1?'مرجع عربي متكامل لفهم الذكاء الاصطناعي وبناء المهارات من الصفر إلى الاحتراف.\n\nهذه المعاينة تعرض بنية المشروع ومحاوره الأساسية، بينما تتضمن النسخة الكاملة المحتوى الموسع والتطبيقات والأدوات والوكيل الذكي المصاحب.':p[1]+'\n\nتقدم الموسوعة هذا المحور ضمن تسلسل تعليمي مترابط، مع ربط المفاهيم النظرية بالتطبيق العملي والمصطلحات التقنية الشائعة.')+'</div>';prev.disabled=n===1;next.disabled=n===20;document.querySelectorAll('.dots button').forEach((b,i)=>b.classList.toggle('active',i===n-1))}prev.onclick=()=>go(n-1);next.onclick=()=>go(n+1);addEventListener('hashchange',()=>{n=Math.max(1,Math.min(20,parseInt(location.hash.slice(1))||1));render()});render();</script></body></html>

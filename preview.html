<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة الموسوعة — 20 صفحة</title><style>body{margin:0;background:#eef1f5;font-family:Arial,sans-serif;color:#172033}.bar{position:sticky;top:0;background:#fff;padding:12px;text-align:center;box-shadow:0 2px 10px #0001;z-index:2}.page{width:min(900px,94vw);min-height:900px;margin:20px auto;padding:38px;background:#fff;box-shadow:0 4px 22px #0002;white-space:pre-wrap;line-height:1.9;font-size:17px;box-sizing:border-box}@media(max-width:600px){.page{padding:24px;font-size:16px;min-height:700px}}</style></head><body><div class="bar">المعاينة المجانية — الصفحة <span id="n">1</span> من 20</div><main id="page" class="page"></main><script>const pages=["الموسوعة الشاملة في الذكاء الاصطناعي\n\nمن الصفر إلى الاحتراف\n\nمحمد مصطفى بابكر","دليل استخدام الموسوعة الشاملة للذكاء الاصطناعي","خريطة رحلة تعلم الذكاء الاصطناعي","مقدمة المشروع وأهدافه","لماذا هذه الموسوعة؟","رحلة تطور الذكاء الاصطناعي عبر الزمن","أنواع الذكاء الاصطناعي: دليل تعليمي شامل","أساسيات الذكاء الاصطناعي","المفاهيم الأساسية والخرائط المعرفية","تعلم الآلة والخوارزميات","التعلم الخاضع للإشراف وغير الخاضع للإشراف","التعلم المعزز وتقييم النماذج","الشبكات العصبية والتعلم العميق","الشبكات العصبية المتكررة RNN","الذاكرة طويلة قصيرة المدى LSTM","المحولات وآلية الانتباه","النماذج اللغوية الكبيرة LLMs","هندسة الأوامر Prompt Engineering","التوليد المعزز بالاسترجاع RAG","الوكيل الذكي وتطبيقاته"];function show(){let n=parseInt(location.hash.slice(1))||1;n=Math.max(1,Math.min(20,n));document.getElementById('n').textContent=n;document.getElementById('page').textContent=pages[n-1]||'صفحة المعاينة';}addEventListener('hashchange',show);show();</script></body></html>

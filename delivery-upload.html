<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>رفع الموسوعة المدفوعة</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f3ed;margin:0;color:#222}
.wrap{max-width:650px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 35px #0001}
label{display:block;font-weight:700;margin:16px 0 7px}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;font:inherit}
input{border:1px solid #ccc}button{margin-top:18px;border:0;background:#111;color:#fff;font-weight:800}
button:disabled{opacity:.5}.status{margin-top:18px;padding:14px;border-radius:10px;background:#f3f3f3;line-height:1.8}.ok{background:#edf9ef}.bad{background:#fff0f0}
.small{color:#666;line-height:1.8}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1>📚 رفع الموسوعة المدفوعة</h1>
<p class="small">هذه صفحة رفع مستقلة؛ لا تستخدم نموذجًا يعيد تحميل الصفحة. الملف يُرفع على أجزاء 1 ميجابايت إلى Worker المحمي.</p>
<label>مفتاح المشرف</label>
<input id="key" type="password" autocomplete="off">
<label>ملف PDF الكامل</label>
<input id="file" type="file" accept="application/pdf,.pdf">
<button id="uploadBtn" type="button">رفع النسخة الآن</button>
<div id="s" class="status">جاهز للرفع.</div>
</section></main>
<script>
const btn=document.getElementById("uploadBtn"),s=document.getElementById("s");
btn.addEventListener("click",async()=>{
 const file=document.getElementById("file").files[0],key=document.getElementById("key").value.trim();
 if(!key){s.className="status bad";s.textContent="أدخل مفتاح المشرف.";return}
 if(!file){s.className="status bad";s.textContent="اختر ملف PDF أولاً.";return}
 if(file.size>25*1024*1024){s.className="status bad";s.textContent="الملف أكبر من 25 ميجابايت.";return}
 btn.disabled=true;s.className="status";
 const chunkSize=1024*1024,total=Math.ceil(file.size/chunkSize),session=crypto.randomUUID().replaceAll("-","");
 try{
  for(let i=0;i<total;i++){
   const chunk=file.slice(i*chunkSize,Math.min(file.size,(i+1)*chunkSize));
   s.textContent="جارٍ رفع الجزء "+(i+1)+" من "+total+"…";
   const r=await fetch("https://smart-encyclopedias-delivery.moh1442010.workers.dev/api/admin/upload-book/chunk?session="+session+"&index="+i+"&total="+total+"&size="+file.size,{
    method:"PUT",headers:{"content-type":"application/octet-stream","x-admin-key":key},body:chunk
   });
   const d=await r.json().catch(()=>({}));
   if(!r.ok||!d.ok) throw new Error((d.error||"chunk_upload_failed")+" (HTTP "+r.status+")");
  }
  s.textContent="جاري تجميع النسخة…";
  const r=await fetch("https://smart-encyclopedias-delivery.moh1442010.workers.dev/api/admin/upload-book/finalize?session="+session+"&total="+total+"&size="+file.size,{
   method:"POST",headers:{"x-admin-key":key}
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok) throw new Error((d.error||"finalize_failed")+" (HTTP "+r.status+")");
  s.className="status ok";s.textContent="✅ تم رفع النسخة الكاملة بنجاح — "+d.pages+" صفحة.";
 }catch(e){s.className="status bad";s.textContent="❌ لم يتم الرفع: "+e.message;btn.disabled=false;}
});
</script>
</body></html>

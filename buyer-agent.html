<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>وكيل النسخة المرخّصة</title>
<style>
body{margin:0;background:#f7f3e8;color:#252525;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd4bf;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000d}
h1{margin:0 0 8px;color:#173b73}.muted{color:#666}.status{padding:10px;border-radius:10px;background:#f2efe7;margin:12px 0}
.log{min-height:280px;max-height:55vh;overflow:auto;border:1px solid #ddd;border-radius:12px;padding:12px;background:#fcfbf7}
.item{padding:10px 12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.user{background:#e9f0fb}.bot{background:#f0eee8}
form{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:13px;border:1px solid #bbb;border-radius:10px;font-size:16px}button{padding:13px 18px;border:0;border-radius:10px;background:#173b73;color:#fff;font-weight:700}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>وكيل النسخة المرخّصة 🤝</h1>
<p class="muted">هذا الوكيل لا يعمل إلا مع ترخيص فعّال ومربوط بالجهاز. الإصدار المرتبط: الموسوعة الكاملة — 260 صفحة.</p>
<div id="status" class="status">جارٍ التحقق من الترخيص…</div>
<div id="log" class="log" hidden></div>
<form id="form" hidden><input id="input" autocomplete="off" placeholder="اكتب سؤالك عن الذكاء الاصطناعي أو عن الاستفادة من النسخة"><button>إرسال</button></form>
</section></main><script src="assets/buyer-agent.js" defer></script></body></html>

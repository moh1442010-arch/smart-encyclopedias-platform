plugins { id 'com.android.application' }
// Android 10 (API 29) minimum; Android 9 is no longer supported. Version 2.8.3 is a review candidate; release remains blocked by acceptance gates.
// Preserve applicationId and SQLite database names across updates; versionCode must increase monotonically.
android {
    buildFeatures { buildConfig true }
    namespace 'com.mohammedmustafa.almizan.bakery'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mohammedmustafa.almizan.bakery'
        minSdk 29
        targetSdk 35
        versionCode 280003
        versionName '2.8.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'net.zetetic:sqlcipher-android:4.19.1@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

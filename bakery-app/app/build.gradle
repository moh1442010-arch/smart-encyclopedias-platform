plugins { id 'com.android.application' }
android {
    namespace 'com.mohammedmustafa.almizan.bakery'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mohammedmustafa.almizan.bakery'
        minSdk 23
        targetSdk 35
        versionCode 250000
        versionName '2.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

plugins { id 'com.android.application' }
// Standalone offline-first bakery app; includes operating-cost and margin calculator. Review-only pending device acceptance.
android {
    namespace 'com.mohammedmustafa.almizan.bakery'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mohammedmustafa.almizan.bakery'
        minSdk 23
        targetSdk 35
        versionCode 250002
        versionName '2.5.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

plugins { id 'com.android.application' }
// Standalone offline-first bakery app; includes operating-cost and margin calculator. Review-only pending device acceptance.
// Preserve applicationId and SQLite database name across updates; versionCode must increase monotonically.
android {
    buildFeatures { buildConfig true }
    namespace 'com.mohammedmustafa.almizan.bakery'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mohammedmustafa.almizan.bakery'
        minSdk 23
        targetSdk 35
        versionCode 280000
        versionName '2.8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'net.zetetic:sqlcipher-android:4.6.1@aar'
    implementation 'androidx.sqlite:sqlite:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
